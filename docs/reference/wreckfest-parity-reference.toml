[[ref]]
metric = "tap_0.2_100_offset_m"
car = "kestrel_ts"
value = "≤ 3.5"
source = "clip 3: a 0.15 s tap at 100+ mph ≈ a lane change (qualitative)"

[[ref]]
metric = "liftoff_60_spun"
