name: Contract guard

# Fails any PR that changes crates/wp_contracts/ or schemas/ without bumping
# wp_contracts::CONTRACT_VERSION and adding a matching "## v<version>" entry to
# docs/CONTRACT_CHANGELOG.md. Logic lives in tools/ci/contract_guard.sh (runnable locally).
on:
  pull_request:

jobs:
  contract-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: tools/ci/contract_guard.sh origin/${{ github.base_ref }}
