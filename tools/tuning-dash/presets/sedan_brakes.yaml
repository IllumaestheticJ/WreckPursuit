# simcli scenario sweep: front brake torque vs the sedan 100–0 scenario's own expectations.
description: Sedan front brake torque ×0.5–1.3 → simcli vehicle_sedan_brake (pass/fail, path)
probe:
  kind: scenario
  file: apps/simcli/scenarios/vehicle/sedan_brake.ron
params:
  - {target: "car:debug_sedan:brakes.max_torque_front_nm", label: front brake torque, op: scale, values: [0.5, 0.7, 0.9, 1.0, 1.1, 1.3]}
plots: [car.distance_m, car.max_long_g, car.final_speed_mps]
