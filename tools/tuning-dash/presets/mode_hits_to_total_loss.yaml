# Round 6b: damage modes vs CLAUDE.md's mode semantics, every car in data/cars.
#  - Arcade: "punishing but survivable; one hard hit degrades, several end the car".
#  - Simulation: "one hard hit at speed is a total loss".
# A hard hit = 56 km/h into a rigid barrier (frontal) or a same-mass car into the side.
# The survival probe repeats the wp_damage barrier-harness impact on one damaged model until
# total loss (cap 12) and finds the lowest single-hit total-loss speed (1 km/h resolution).
# Checks: Arcade frontal 56 degrades (health <= 0.9) and ends in 2-6 hits; Simulation frontal
# 56 ends in 1. Side impacts are reported, not checked. No data is changed.
# Generated variant list: one per car x mode x impact (class in the name). Round 8 added H's
# drayman_cargo, furrow_24 and tansy_13; the cars audit (2026-10-23) the eleven later cars and wave 3.
description: Hits to total loss and single-hit total-loss speed, every car, Arcade vs Simulation, frontal and side
probe:
  kind: survival
  speeds_kmh: [25, 40, 56, 80]
variants:
  - name: arashi_t4 (Sport) arc frontal
    probe: {car: arashi_t4, mode: Arcade, impact: Frontal}
    expect: [{metric: "health_after_1@56", min: 0, max: 0.9}, {metric: "hits_to_total_loss@56", min: 2, max: 6}]
  - name: arashi_t4 (Sport) arc side
    probe: {car: arashi_t4, mode: Arcade, impact: Side}
  - name: arashi_t4 (Sport) sim frontal
    probe: {car: arashi_t4, mode: Simulation, impact: Frontal}
    expect: [{metric: "hits_to_total_loss@56", min: 1, max: 1}]
