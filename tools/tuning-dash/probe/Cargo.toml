[package]
name = "tuning-probe"
description = "Measurement backend of tools/tuning-dash: applies parameter overrides to an in-memory data root and runs one simcli scenario, the wp_vehicle handling metrics or the wp_damage barrier harness; also diffs and promotes data files."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
wp_contracts.workspace = true
wp_vehicle.workspace = true
wp_damage.workspace = true
wp_sim.workspace = true
wp_police.workspace = true
simcli = { path = "../../../apps/simcli" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
ron.workspace = true

[[bin]]
name = "tuning-probe"
path = "src/main.rs"
