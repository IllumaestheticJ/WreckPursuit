[package]
name = "meta-cli"
description = "Command-line client for the WreckPursuit meta service (apps/meta)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "meta-cli"
path = "src/main.rs"

[dependencies]
wp_meta = { path = "../../apps/meta" }
wp_contracts.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive", "env"] }
