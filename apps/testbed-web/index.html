<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WreckPursuit Testbed</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #111; color: #ddd; font: 12px/1.35 monospace; }
      #overlay { position: fixed; inset: 0; pointer-events: none; }
      .panel { background: rgba(0, 0, 0, 0.6); padding: 6px 8px; border-radius: 4px; pointer-events: auto; }
      .hidden { display: none !important; }
      .left-col { position: absolute; top: 8px; left: 8px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
      .hud-main { min-width: 300px; }
      .hud-main .speed { font-size: 28px; color: #fff; }
      .hud-main .gear { font-size: 28px; color: #ffdc00; margin-left: 12px; }
      .dim { color: #999; }
      .rtf-warn { color: #ffb020; font-weight: bold; }
      .badge { display: inline-block; padding: 0 4px; margin: 2px 3px 0 0; border-radius: 3px; font-size: 11px; }
      .badge.on { background: #2a6; color: #fff; }
      .badge.off { background: #333; color: #777; }
      .badge.rec { background: #c22; color: #fff; }
      .bar { display: inline-block; position: relative; width: 140px; height: 9px; background: #222; margin-left: 6px; vertical-align: middle; }
      .bar i { position: absolute; top: 0; bottom: 0; left: 0; }
      .bar b { position: absolute; top: -2px; bottom: -2px; left: 50%; width: 1px; background: #888; }
      /* HUD corners (playtest row 67; stacks sized at run time by src/ui/layout.ts): top-left speedo +
         race HUD, top-centre chase readout / banner, top-right damage column, bottom-right minimap,
         bottom-left developer + audio panels, telemetry between them. */
      .right-col { position: absolute; top: 8px; right: 8px; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; overflow: hidden; }
      .right-col > canvas { flex: 0 0 auto; }
      .right-col > .comps, .right-col > .regions, .right-col > .feed { flex: 0 1 auto; min-height: 0; }
      /* Player mode (game menu, developer panels off): only the game HUD. */
      body.wp-player #controls, body.wp-player .telemetry, body.wp-player .comps, body.wp-player .regions,
      body.wp-player .feed, body.wp-player .inputs, body.wp-player #audio-panel, body.wp-player #error,
      body.wp-player .hud-main .dim { display: none !important; }
      #pursuit-banner { position: absolute; top: 34%; left: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; text-shadow: 0 2px 6px #000; }
      #pursuit-banner b { display: block; font: 900 44px/1 system-ui, sans-serif; letter-spacing: 0.12em; }
      #pursuit-banner span { display: block; margin-top: 4px; font-size: 13px; color: #ddd; }
      #pursuit-banner[data-kind="pursuit"] b { color: #ff3b30; animation: wp-strobe 0.8s steps(1) infinite; }
      #pursuit-banner[data-kind="searching"] b { color: #ffcc00; }
      #pursuit-banner[data-kind="escaped"] b { color: #2ecc40; }
      #pursuit-banner[data-kind="captured"] b { color: #3b82ff; }
      @keyframes wp-strobe { 50% { color: #3b82ff; } }
      @media (prefers-reduced-motion: reduce) { #pursuit-banner b { animation: none !important; } }
      /* Police radio strip (row 79, src/radio_strip.ts); the chase readout's own radio lines are
         hidden in favour of it (they would show the same transmissions, before they are heard). */
      #radio-strip { position: absolute; top: 120px; left: 50%; width: 480px; overflow: hidden; pointer-events: none; display: flex; flex-direction: column; gap: 2px; font: 13px/1.35 system-ui, sans-serif; z-index: 2; }
      #radio-strip.empty { visibility: hidden; }
      #radio-strip .radio-line { background: rgba(8, 12, 18, 0.72); border-left: 3px solid currentColor; padding: 2px 8px; color: #eef2f6; text-shadow: 0 1px 2px #000; border-radius: 2px; transition: opacity 0.3s; }
      #radio-strip .radio-cs { font: 700 11px/1 ui-monospace, monospace; letter-spacing: 0.06em; margin-right: 6px; }
      /* Row 144 priority tiers: 1-2 highlighted, 3 urgent, 4-5 dimmed. */
      #radio-strip .radio-icon { font-style: normal; margin-right: 6px; }
      #radio-strip .radio-line.tier-1 { font-weight: 700; background: rgba(70, 48, 0, 0.85); border-left-width: 5px; box-shadow: 0 0 0 1px rgba(255, 204, 0, 0.7); }
      #radio-strip .radio-line.tier-1 .radio-icon { color: #ffcc00; }
      #radio-strip .radio-line.tier-2 { font-weight: 700; background: rgba(10, 30, 70, 0.82); border-left-width: 5px; }
      #radio-strip .radio-line.tier-2 .radio-icon { color: #64b5f6; }
      #radio-strip .radio-line.tier-3 { background: rgba(90, 8, 8, 0.82); color: #fff; font-style: italic; text-transform: uppercase; letter-spacing: 0.02em; }
      #radio-strip .radio-line.tier-3 .radio-icon { color: #ff5252; font-style: normal; }
      #radio-strip .radio-line.tier-4, #radio-strip .radio-line.tier-5 { opacity: 0.62; }
      #ui-chase .wp-hud-alerts li[data-ch="dispatch"], #ui-chase .wp-hud-alerts li[data-ch="unit"] { display: none; }
      .feed { max-width: 360px; max-height: 22vh; overflow: auto; font-size: 11px; }
      .comps, .regions { white-space: pre; max-height: 30vh; overflow: auto; }
      .comps .bar { width: 80px; }
      .inputs { }
      .telemetry { position: absolute; bottom: 8px; left: 552px; padding: 0; }
      .controls-panel { max-width: 720px; z-index: 6; }
      .bind-table { border-collapse: collapse; margin: 6px 0; }
      .bind-table td, .bind-table th { padding: 1px 4px; text-align: left; font-weight: normal; }
      .bind-table button.bind { min-width: 72px; }
      .bind-table button.waiting { background: #a60; color: #fff; }
      /* Per-device input shaping + live test bars (src/ui/controls.ts). */
      .shape-grid { display: grid; grid-template-columns: max-content 140px 40px; gap: 1px 8px; align-items: center; margin: 4px 0; }
      .shape-bars { display: grid; grid-template-columns: 64px 220px 40px; gap: 3px 8px; align-items: center; margin: 4px 0; }
      .shape-bar { position: relative; height: 9px; border-radius: 4px; background: #333; overflow: hidden; }
      .shape-bar i { position: absolute; top: 0; bottom: 0; left: 0; width: 0; background: #3dff8f; }
      .shape-bar.bipolar::after { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; background: #888; }
      .help { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); max-width: 640px; max-height: calc(100vh - 16px); overflow: auto; z-index: 5; background: rgba(0, 0, 0, 0.92); }
      #controls { position: absolute; bottom: 8px; left: 8px; max-width: 520px; max-height: 45vh; overflow: auto; }
      #controls .row { margin: 3px 0; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
      #controls button, #controls select, #controls input { font: 11px monospace; background: #222; color: #ddd; border: 1px solid #555; border-radius: 3px; padding: 1px 5px; }
      #controls button:hover { background: #333; }
      #controls button.preset[aria-pressed="true"] { background: #2a6; color: #fff; border-color: #2a6; }
      #controls input[type="number"] { width: 50px; }
      #rp-scrub { flex: 1; min-width: 160px; }
      #controls .row.car-stats { display: grid; grid-template-columns: auto 1fr auto; gap: 1px 8px; max-width: 360px; }
      .car-stats-name { grid-column: 1 / -1; color: #fff; }
      .car-stat { display: contents; }
      .car-stat-track { position: relative; height: 8px; align-self: center; background: #222; border: 1px solid #444; }
      .car-stat-track i { position: absolute; top: 0; bottom: 0; left: 0; background: #ffdc00; transition: width 0.2s; }
      .car-stat-value { text-align: right; color: #ccc; }
      @media (prefers-reduced-motion: reduce) { .car-stat-track i { transition: none; } }
      #sc-result .pass { color: #2ecc40; }
      #sc-result .fail { color: #ff4136; }
      #sc-result .pending { color: #aaa; }
      .mod-shop { position: absolute; top: 8px; right: 8px; width: 340px; max-width: calc(100vw - 32px); max-height: calc(100vh - 32px); overflow: auto; z-index: 4; background: rgba(0, 0, 0, 0.85); }
      .mod-shop-head { display: flex; gap: 6px; align-items: center; margin-bottom: 4px; }
      .mod-shop-head b { flex: 1; color: #fff; }
      .mod-shop button { font: 11px monospace; background: #222; color: #ddd; border: 1px solid #555; border-radius: 3px; padding: 1px 5px; margin: 1px 2px 1px 0; cursor: pointer; }
      .mod-shop button:hover { background: #333; }
      .mod-shop button.mod.shows { border-color: #7a6a20; }
      .mod-shop button.mod.on { background: #2a6; border-color: #2a6; color: #fff; }
      .mod-shop-fitted { margin: 2px 0 4px; }
      .mod-shop-status.bad { color: #ff8060; margin-bottom: 4px; }
      .mod-slot { margin: 4px 0; }
      .mod-slot-name { color: #ffdc00; }
      /* Races (workstream 15): picker, HUD, countdown, results (src/ui/race.tsx). */
      .wp-race-picker { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(560px, calc(100vw - 32px)); max-height: 80vh; overflow: auto; pointer-events: auto; z-index: 80; }
      .wp-race-cards { display: grid; gap: 0.6em; }
      .wp-race-card { border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 4px; padding: 0.5em 0.6em; }
      .wp-race-hud { position: absolute; left: 8px; top: 312px; width: min(420px, calc(100vw - 32px)); pointer-events: none; z-index: 60; }
      .wp-race-hud-grid { display: grid; grid-template-columns: 1fr auto; gap: 0.6em; align-items: start; }
      .wp-race-standings { width: 100%; font-size: 0.8em; margin-top: 0.4em; }
      .wp-race-standings .num, .wp-race-results .num { text-align: right; }
      .wp-race-standings .is-local, .wp-race-results .is-local { color: var(--scan, #7cf); font-weight: bold; }
      .wp-race-countdown { position: absolute; left: 50%; top: 30%; transform: translate(-50%, -50%); font: 900 96px/1 system-ui, sans-serif; color: #ffd23f; text-shadow: 0 4px 12px #000; pointer-events: none; }
      .wp-race-go { color: #2ee59d; }
      .wp-race-results { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(520px, calc(100vw - 32px)); max-height: 85vh; overflow: auto; pointer-events: auto; z-index: 75; }
      #photo-panel { position: fixed; top: 8px; right: 8px; width: 300px; max-height: calc(100vh - 16px); overflow: auto; z-index: 10; }
      #photo-panel .row { margin: 4px 0; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
      #photo-panel button, #photo-panel select { font: 11px monospace; background: #222; color: #ddd; border: 1px solid #555; border-radius: 3px; padding: 1px 5px; }
      #photo-panel button:hover { background: #333; }
      #photo-panel button.on { background: #2a6; color: #fff; border-color: #2a6; }
      #photo-panel .ph-presets { display: flex; flex-wrap: wrap; gap: 3px; margin: 5px 0; }
      #photo-panel .ph-grid label { display: grid; grid-template-columns: 96px 1fr 40px; align-items: center; }
      #photo-panel .ph-grid input { width: 100%; accent-color: #2a6; }
      #photo-panel .ph-grid output { text-align: right; color: #aaa; }
      #photo-panel .ph-status { min-height: 1.35em; color: #9fd; }
      #photo-chip { position: fixed; top: 8px; right: 8px; z-index: 10; font: 12px monospace; background: rgba(0, 0, 0, 0.6); color: #ddd; border: 1px solid #555; border-radius: 4px; padding: 4px 8px; }
      #photo-panel .ph-letterbox { vertical-align: middle; margin: 0 2px 0 0; }
      @media (max-width: 520px) { #photo-panel { left: 8px; width: auto; max-height: 45vh; top: auto; bottom: 8px; } }
      #error { position: absolute; top: 40%; left: 50%; transform: translateX(-50%); color: #f66; white-space: pre; }
    </style>
  </head>
  <body>
    <div id="overlay">
      <div id="controls" class="panel">
        <div class="row">
          scenario <select id="sc-select"></select>
          speed <input id="sc-speed" type="number" min="5" max="250" step="5" value="56" /> km/h
          <button id="sc-run">run</button>
          <button id="sc-free">free drive</button>
          <button id="sc-chase" title="city at night (map below), police, traffic, you start speeding">city chase</button>
          <button id="sc-chase-rain" title="the city chase in a night downpour on a soaked road">rainy night</button>
          <label title="free drive / city chase use your career car, its damage and mods, and the result goes into the career"><input type="checkbox" id="career" checked />career</label>
          <button id="controls-open" title="rebind keyboard and gamepad controls (F9)">controls</button>
          <button id="sc-garage" title="your career: cars, repairs, mods, dealer, impound (ends a career run)">garage</button>
          <button id="sc-races" title="street races with AI racers (Port Vesper and the grid city)">races</button>
          <button id="photo" title="pause, free camera, filters, save or copy the image (also from replays)">📷 photo (F7)</button>
        </div>
        <div class="row">
          mode <select id="mode"><option>Arcade</option><option>Simulation</option></select>
          car <select id="car"></select>
          <button id="mods-btn" title="install mods on this car: wheels, tires, aero, body kits, cages… (you see them on the car)">mods</button>
          <label title="free drive in the selected city with traffic"><input type="checkbox" id="city" />city</label>
          <select id="city-map" title="city for free drive and city chase">
            <option value="vesper_v2">Port Vesper v2 (hills, curves)</option>
            <option value="procedural_12x12">grid 12×12 (flat)</option>
          </select>
          style <select id="style" title="art style: greybox (debug) or low-poly dark (docs/art/STYLE_DECISION.md)"></select>
          weather <select id="weather" title="restarts the session with this weather (the scenario's own weather on 'scenario')"><option value="auto">scenario</option></select>
          bench <button class="bench" data-n="1">1</button><button class="bench" data-n="8">8</button><button class="bench" data-n="24">24</button>
          <span id="bench-out" class="dim"></span>
        </div>
        <div class="row" id="tune-row" title="free car tune for the selected car outside the career (career runs use the tune saved in the garage); 3 = stock, applies from the next start">
          car tune
        </div>
        <div class="row" id="preset-row" title="one click: damage mode + assists together (GDD §6); any box below can still be changed">
          preset
          <button class="preset" data-p="Rookie" aria-pressed="false" title="Arcade damage, every assist on">Rookie</button>
          <button class="preset" data-p="Street" aria-pressed="false" title="Arcade damage, ABS Full + TCS Half">Street</button>
          <button class="preset" data-p="Sim" aria-pressed="false" title="Simulation damage, ABS Half, TCS off, ESC off, manual gears">Sim</button>
          <span id="preset-state" class="dim"></span>
        </div>
        <div class="row hidden" id="car-stats"></div>
        <div class="row" id="assist-row">
          assists
          <label title="anti-lock brakes. Off: wheels lock. Half: short lock-ups, still steers. Full: no lock-ups"
            >ABS <select data-a="abs" class="assist-level"><option>Off</option><option>Half</option><option>Full</option></select></label
          >
          <label title="traction control. Off: the throttle you press (raw). Half: some wheelspin and smoke to slide with. Full: barely any wheelspin"
            >TCS <select data-a="tcs" class="assist-level"><option>Off</option><option>Half</option><option>Full</option></select></label
          >
          <label><input type="checkbox" data-a="esc" />ESC</label>
          <label><input type="checkbox" data-a="auto_gears" />auto gears</label>
          <label title="automatic: the car works the clutch (launch, stall prevention, shifts). manual: your clutch control is used directly; bind it in the controls panel (F9)">clutch <select id="clutch-mode"><option value="auto">automatic</option><option value="manual">manual</option></select></label>
          <label title="Countersteer help (keyboard / gamepad). In a slide: keys released = the front wheels follow the car's travel (straighten); key against the slide = fast catch at the rack's full speed. 0 = plain return to centre, 100 = fastest. Never acts while you steer into the turn or during a handbrake turn; never adds grip or yaw. Drift lab (F8) has the lab-only hold mode and throttle smoothing (both off by default)."
            >countersteer <input type="range" id="cstr" min="0" max="100" step="5" style="width: 80px" />
            <span id="cstr-val" class="dim">–</span></label
          >
        </div>
        <div class="row">
          replay
          <button id="rec">● record</button>
          <button id="rec-stop">■ stop</button>
          <button id="rp-last">load last</button>
          <label class="dim">file <input id="rp-file" type="file" accept=".bin" style="width: 90px" /></label>
          <button id="rp-dl">download</button>
          <button id="rp-csv">csv</button>
          <button id="rp-exit">exit</button>
          <label class="dim" title="after a big crash, play the instant replay without asking"><input id="rp-auto-crash" type="checkbox" /> auto crash replay</label>
        </div>
        <div class="row" id="rp-bar">
          <button id="rp-play">⏯</button>
          <button id="rp-back">⏮</button>
          <button id="rp-step">⏭</button>
          <select id="rp-speed"><option>0.1</option><option>0.25</option><option>0.5</option><option selected>1</option><option>2</option><option>4</option></select>
          <input id="rp-scrub" type="range" min="0" max="0" value="0" />
        </div>
        <div class="row dim" id="rp-status">no replay loaded</div>
        <div id="sc-result"></div>
      </div>
      <div id="mod-shop"></div>
      <div id="error"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
