[package]
name = "wp_meta"
description = "Meta services: accounts, persistence, instance directory, matchmaking, leaderboards, admin."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "wp-meta"
path = "src/main.rs"

[dependencies]
wp_contracts.workspace = true
wp_economy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["signal"] }
axum = "0.8"
# Same version as wp_economy's optional dependency so both share one bundled libsqlite3-sys.
rusqlite = { version = "0.40", features = ["bundled"] }
argon2 = "0.5"
sha2 = "0.10"
hex = "0.4"
getrandom = "0.3"
# Blocking HTTP client for `MetaClient` (meta-cli, tests, apps/server). No TLS: run behind a proxy.
ureq = { version = "2", default-features = false, features = ["json"] }
