[package]
name = "wp_server"
description = "Headless authoritative server: one city instance over websockets, admin status endpoint, scripted bots."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "wp-server"
path = "src/main.rs"

[dependencies]
wp_contracts.workspace = true
wp_sim.workspace = true
wp_world.workspace = true
wp_net = { workspace = true, features = ["native"] }
tokio = { workspace = true, features = ["io-util"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
