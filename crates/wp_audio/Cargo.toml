[package]
name = "wp_audio"
description = "Audio director: turns vehicle state and SimEvents into a deterministic AudioCommand stream (engine layers, tires, impacts, sirens, scanner). Pure logic, no audio backend."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
wp_contracts.workspace = true
wp_math.workspace = true
# Decodes PoliceEvent payloads (Radio, SpikeHit, pursuits) until v0.3.0 types them in contracts.
wp_police.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Flat-ground rig for the engine-shift trace (tests/support/engine_trace.rs).
wp_vehicle.workspace = true
# Real physics output for the determinism test (dev only; wp_audio itself never depends on the sim).
wp_sim.workspace = true
# Run the determinism lint over this crate (it is not in lint-determinism's SIM_CRATES yet).
lint-determinism = { path = "../../tools/lint-determinism" }
# Reads data/police/tools.toml in a test (scanner delays must match).
toml.workspace = true
