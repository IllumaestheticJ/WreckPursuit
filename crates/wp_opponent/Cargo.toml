[package]
name = "wp_opponent"
description = "AI street-racer opponents: racing lines, speed profiles, driver personalities, race tactics."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
wp_contracts.workspace = true
wp_math.workspace = true
wp_vehicle.workspace = true
wp_world.workspace = true
wp_police.workspace = true
serde.workspace = true
serde_json.workspace = true

[features]
# Opt-in full-race draft test (`draft_lets_a_faster_driver_in_the_same_car_pass`). The sim
# applies slipstream to every car since 2026-10-31 (docs/integration/drafting.md); the
# feature only turns this long sweep on.
sim-draft-hook = []

[dev-dependencies]
wp_sim.workspace = true
wp_damage.workspace = true
lint-determinism = { path = "../../tools/lint-determinism" }
