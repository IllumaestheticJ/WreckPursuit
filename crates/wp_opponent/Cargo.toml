[package]
name = "wp_opponent"
description = "AI street-racer opponents: racing lines, speed profiles, driver personalities, race tactics."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
wp_contracts.workspace = true
wp_math.workspace = true
wp_vehicle.workspace = true
wp_world.workspace = true
wp_police.workspace = true
serde.workspace = true
serde_json.workspace = true

[features]
# Full-sim draft tests: need `wp_sim::Sim::set_drag_scale` (requested from the lead, see
# docs/integration/opponent.md). Off by default so the crate builds against today's wp_sim.
sim-draft-hook = []

[dev-dependencies]
wp_sim.workspace = true
wp_damage.workspace = true
lint-determinism = { path = "../../tools/lint-determinism" }
