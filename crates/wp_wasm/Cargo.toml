[package]
name = "wp_wasm"
description = "wasm-bindgen surface of the simulation for the browser testbed: sessions, packed state arrays, scenarios and deterministic replay."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wp_contracts.workspace = true
wp_math.workspace = true
wp_sim.workspace = true
# One-click assist presets (`wp_vehicle::AssistPreset`) and the stat bars of a modded car
# (build_stats.rs: `wp_vehicle::stats` on the rig).
wp_vehicle.workspace = true
wp_police.workspace = true
wp_world.workspace = true
# Career garage (machine G): repairs the stored lattice of a car between runs
# (`DamageModel::restore_full` / `apply_repair`). Pure Rust, already reachable via wp_sim.
wp_damage.workspace = true
# Repair billing for the testbed's garage overlay (workstream 16); default features only — never
# `native` (SQLite).
wp_economy.workspace = true
# Multiplayer client (workstream F); default features only — never `native`.
wp_net.workspace = true
# Audio director (workstream J); pure logic, wasm32-clean. Used only by src/audio.rs.
wp_audio.workspace = true
wp_weather.workspace = true
# Race picker (workstream 15): judge, AI entrants (wp_opponent), stakes; pure logic, wasm32-clean.
wp_race.workspace = true
wp_opponent.workspace = true
# Canonical scenario format v2, sim setup (`build_sim`), drivers, expectations and replay.bin
# (simcli lib is wasm32-clean; see tools/wasm-determinism).
simcli = { path = "../../apps/simcli" }
serde.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true
# Pure-Rust, no_std-capable binary codec for events and replays (wasm32-clean).
postcard = { version = "1", default-features = false, features = ["alloc"] }

[dev-dependencies]
# tests/drawn_colliders.rs: classify which static collider a contact hit (already in the tree
# via wp_sim; dev-only, so never part of the wasm build).
rapier3d.workspace = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false
