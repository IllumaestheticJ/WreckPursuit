[package]
name = "wp_wasm"
description = "wasm-bindgen surface of the simulation for the browser testbed: sessions, packed state arrays, scenarios and deterministic replay."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wp_contracts.workspace = true
wp_math.workspace = true
wp_sim.workspace = true
# Multiplayer client (workstream F); default features only — never `native`.
wp_net.workspace = true
# Canonical scenario format v2 parser (simcli lib is wasm32-clean; see tools/wasm-determinism).
simcli = { path = "../../apps/simcli" }
serde.workspace = true
serde_json.workspace = true
ron.workspace = true
wasm-bindgen.workspace = true
# Pure-Rust, no_std-capable binary codec for events and replays (wasm32-clean).
postcard = { version = "1", default-features = false, features = ["alloc"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false
