[package]
name = "wp_render"
description = "Our own renderer (engine spike): skins the per-panel car meshes to the damage lattice and draws them with wgpu. CPU scene code by default; the GPU path is behind feature `gpu`."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# wgpu renderer (native Vulkan/Metal/DX12; WebGPU later) + offscreen PNG capture.
gpu = ["dep:wgpu", "dep:bytemuck", "dep:pollster", "dep:png"]

[dependencies]
wp_contracts.workspace = true
wp_damage.workspace = true
wp_sim.workspace = true
wp_world.workspace = true
serde.workspace = true
serde_json.workspace = true
# Same major version rapier already pulls in, so no second copy is built.
glam = "0.33"
wgpu = { version = "30", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
pollster = { version = "0.4", optional = true }
png = { version = "0.18", optional = true }

[dev-dependencies]
# Integration test builds a real free-drive session (no cycle: wp_wasm does not use wp_render).
wp_wasm = { path = "../wp_wasm" }
