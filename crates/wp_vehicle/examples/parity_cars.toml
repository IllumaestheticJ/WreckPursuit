# Parity-only test cars for examples/parity.rs: built to the owner's reference-game car specs
# (docs/reference/wreckfest-keyboard.md → "Reference car specs"). They are NOT in the player
# roster and have no data/cars files: parity.rs builds each one from a roster `base` car at
# run time.
#
# What changes from the base car:
# - mass_kg; inertias, springs, dampers, anti-roll bars and brake torques scale with the mass
#   ratio, so ride frequency, damping ratio and braking deceleration stay at our defaults
# - a torque curve with peak torque at torque_rpm and peak power at power_rpm, redline 8 %
#   above the power peak, rev limit 300 rpm above that
# - gear ratios and final drive (plausible for the class, written out below)
# - clutch capacity of at least 1.35 × peak torque
# Tyres, geometry, weight distribution, steering, aero and the differential type come from
# the base car. The differential is the base car file's `diff_*` because a parity id has no
# differentials.toml entry.
#
# Names describe the role only (rule 9: no reference-game car names).

[[car]]
id = "parity_rwd_a"
ref = "REF-RWD-A"
role = "full-size RWD muscle, 345 kW / 793 N·m / 1369 kg, 5-speed (clips 4, 5)"
base = "rampart_50"
mass_kg = 1369.0
power_kw = 345.0
power_rpm = 4800.0
torque_nm = 793.0
torque_rpm = 3200.0
gear_ratios = [2.95, 1.94, 1.34, 1.00, 0.80]
final_drive = 3.55

