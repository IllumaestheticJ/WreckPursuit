[package]
name = "wp_economy"
description = "Money/rep, repair billing, impound, mod tree, garage state."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# SQLite account store for the native server. Never enable from anything reachable from wp_wasm
# (rusqlite's bundled SQLite is compiled from C).
native = ["dep:rusqlite"]

[dependencies]
wp_contracts.workspace = true
wp_math.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
rusqlite = { version = "0.40", features = ["bundled"], optional = true }

[dev-dependencies]
# Tests only: keeps `repair::reference_line` in lockstep with wp_damage's pricing constants.
wp_damage.workspace = true
proptest = { version = "1.12", default-features = false, features = ["std"] }
