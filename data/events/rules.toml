# Race rules per kind. Owned by workstream 15 (wp_race). Loaded by wp_race::RulesTable.
# Units: SI (m, s, N·s, m/s). Keys under [kinds.*] are RaceKind::key().

[common]
# Clean race = no contact above this impulse and no civilian hits. A 1 300 kg car tapping
# another at ~1 m/s closing is ~1 300 N·s; a door-to-door lean stays under the limit.
contact_clean_threshold_ns = 2500.0
civilian_hit_threshold_ns = 400.0
# Gate tolerance = base + per_mps_s × speed. 0.02 s ≈ one sample at 60 Hz with margin.
gate_tolerance_base_m = 1.0
gate_tolerance_per_mps_s = 0.02
# Off-course resets only (leaving the route is never a DQ): the clock runs past the
# corridor half-width + margin; after the grace time the racer is put back on the course.
corridor_margin_m = 2.0
corridor_grace_s = 3.0
max_plausible_speed_mps = 110.0
countdown_s = 3.0

[kinds.sprint]
grid = { Staggered = { row_gap_m = 8.0, column_gap_m = 5.0 } }
min_racers = 2
max_racers = 8
time_limit_s = 900.0
finish_window_s = 60.0

