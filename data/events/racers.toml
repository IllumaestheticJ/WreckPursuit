# The city's street-racing regulars (wp_race::roster). Every named AI racer in the race picker
# and in scheduled night meets comes from this list, so the same faces keep showing up with
# the same car, temperament and track record (picker races may put a regular in another car
# to match the player's car and rep: wp_race::field).
#
# id          stable key (save files, bets, scenario entity `ai_<first name>` in the picker)
# name        display name; nickname is shown in quotes in menus
# car         data/cars id (analog names only)
# home        the part of town they haunt (flavour + scheduled-meet affinity)
# specialty   course type they are best on: hill, highway, downtown, mixed
# tier        lowest licence tier at which they turn up at scheduled meets
#             (rookie, street, pro, elite, legend); picker races list their field explicitly
# rating      starting form rating (Elo-like, 1000 = mid-pack). Moves with every race result.
# profile     wp_opponent::DriverProfile, every field 0..=1
#
# The first five are the picker's original field; wp_race's tests check that
# catalog::AiDriverDef and this file agree on name, car and profile.

