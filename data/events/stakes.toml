# Event stakes. Owned by workstream 15 (wp_race). Loaded by wp_race::StakeTable.
#
#   risk  = kinds.risk + phases.risk + legality.risk
#   purse = kinds.base_purse × brackets.purse × risk_curve(risk)
#   entry = purse × kinds.entry_frac × phases.entry × legality.entry
#   heat  = kinds.heat + phases.heat + legality.heat      (0 for sanctioned events)
#
# Feel target: a D-class night street sprint pays ~2 800 (wp_economy's own feel target for a
# Compact 9 km night sprint), a rare illegal daytime race pays 2.5-4× that, sanctioned day
# circuits pay least but cost no heat.

# [risk, purse multiplier]; both columns strictly ascending.
risk_curve = [
    [0.0, 0.60],
    [1.0, 1.00],
    [2.0, 1.50],
    [3.0, 2.30],
    [4.0, 3.40],
    [6.0, 5.00],
]

[kinds.sprint]
base_purse = 2150
entry_frac = 0.11
risk = 0.6
heat = 1.0

[kinds.circuit]
base_purse = 2000
entry_frac = 0.11
risk = 0.3
heat = 0.6

[kinds.outrun]
base_purse = 1600
entry_frac = 0.15
risk = 0.9
heat = 1.5

[kinds.checkpoint]
base_purse = 1700
entry_frac = 0.10
risk = 0.7
heat = 1.2

[kinds.cannonball]
base_purse = 2600
entry_frac = 0.12
risk = 1.2
heat = 2.0

[kinds.delivery]
base_purse = 2200
entry_frac = 0.08
risk = 1.0
heat = 1.6

[kinds.drag]
base_purse = 900
entry_frac = 0.15
risk = 0.2
heat = 0.4

[kinds.time_attack]
base_purse = 1200
entry_frac = 0.08
risk = 0.1
heat = 0.3

[phases.Dawn]
risk = 0.3
entry = 0.9
heat = 0.5

[phases.Day]
risk = 0.8       # witnesses, traffic, patrols on shift
entry = 0.8
heat = 1.5

[phases.Dusk]
risk = 0.4
entry = 1.0
heat = 0.8

[phases.Night]
risk = 0.5
entry = 1.0
heat = 0.0

[brackets.D]
purse = 1.0
[brackets.C]
purse = 1.35
[brackets.B]
purse = 1.8
[brackets.A]
purse = 2.4
[brackets.S]
purse = 3.2
[brackets.X]
purse = 4.2

# Sanctioned: marshals and closed roads cancel most of the daytime risk (agreed with
# workstream 08 in round 9, race.md R5: the economy's [legality] sanctioned ×0.8 at its Day
# ×0.75 pays these events ~0.45× a night street race, and so do we). Higher entry for less
# prize money.
[legality.sanctioned]
risk = -1.0
entry = 1.5
heat = 0.0
police = "None"

[legality.street]
risk = 0.5
entry = 1.0
heat = 0.0
police = "Normal"

[legality.illegal_daytime]
risk = 2.5
entry = 1.5
heat = 4.0
police = "Max"

# Purses paid by expected finishing time instead of kinds.base_purse (owner, 2026-10-26:
# "make the ashcroft race payout a function of expected finishing time"):
#
#   expected_min = catalog length / races.<id>.pace_kmh
#   purse        = per_minute × expected_min × brackets.purse × risk_curve(risk)
#
# The bracket ladder, risk curve, buy-in, heat and police are the same as for any other race.
# per_minute matches what Loop 9 night pays for its time: base 2 000 for a ~215 s winning lap
# is ~560 per minute.
[timed_purse]
per_minute = 560.0

# Loop 9 → Ashpeak highway run, 17.9 km: the field's winning pace without police is ~145 km/h
# (2026-10-24, seed 29: winner 446 s), so ~7.4 expected minutes.
[timed_purse.races.loop9_ashpeak_highway]
pace_kmh = 145.0
