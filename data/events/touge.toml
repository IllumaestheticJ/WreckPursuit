# Touge battles (wp_race::touge): payouts and rep. Owned by the touge workstream.
#
# Who may race, bet and put up pink slips is NOT decided here: the rep tiers in
# data/economy/career.toml (wp_economy::progression) open Feature::TougeRaces (challengers),
# Feature::BossRaces (bosses), Feature::TougeBetting (side bets, capped by max_bet) and
# Feature::PinkSlips.
#
# Side bet: the stake is taken at the start; a win pays `side_bet_payout` x stake back (stake
# included), a loss or a totaled car pays nothing.
# Rep: `win_rep` / `loss_rep` for the result, plus `totaled_rep` when your car went through the
# wall, plus the pink-slip rep when one was on the line. A boss win also pays `purse` credits.

totaled_rep = -100

[challenger]
win_rep = 150
loss_rep = -40
purse = 0
side_bet_payout = 2.0

[boss]
win_rep = 600
loss_rep = -150
purse = 12000
side_bet_payout = 2.5

[pink_slip]
win_rep = 400
loss_rep = -250

