# Traffic fleet: civilian models and how often each spawns (wp_world::FleetModel).
#
# An agent's model is drawn at spawn by the lane it spawns on: `weight_city` on city lanes,
# `weight_highway` on highway lanes (semis and box trucks live mostly on the highway).
# `length_m` / `width_m` set its spacing and overlap box (bumper to bumper, from the car's
# body_size_m); `max_speed_kmh` caps its desired speed (truck governors); `accel_scale` and
# `headway_scale` scale the sampled driver (heavy vehicles pull away slowly, leave more room).
# Promoted (near-player) agents become the named car with full physics.
# Used when a scenario sets `fleets: true` (the browser free drive and city chase do).

# --- everyday cars
