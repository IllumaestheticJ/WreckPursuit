# Lucciola 350 — style sheet (keys: tools/assets/src/style.rs).
[identity]
tagline = "The poster car — glass cannon in rosso"
personality = "A 90s mid-engine exotic that screams to 8,500 rpm, rotates instantly and costs a fortune every time it touches anything. Theatrical, fragile and gorgeous: everyone looks, nobody can afford to hit it."
silhouette = "Long, low wedge: knife-edge nose, cab-forward bubble canopy, flying buttresses into a louvred engine deck and a short kicked-up tail."
signatures = [
  "Pop-up headlamp pods rising out of the bonnet",
  "Deep side intakes ahead of the rear wheels, louvred engine cover",
  "Twin round tail lamps per side over a centre-twin exhaust",
  "Turbine-fan silver wheels, wider at the rear",
]
lighting = "Pop-ups and low slit driving lamps up front; four round tail lamps in a black mesh panel."

[palette]
base = "#d0101e"
accent = "#1b1b1d"
primer = "#6d6f6a"
alts = ["#f4c20d", "#1b1b1d", "#e8e6dc", "#20407a"]

[body]
