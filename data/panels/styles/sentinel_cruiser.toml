# Sentinel Cruiser — style sheet (see tools/assets/src/style.rs for every key).
[identity]
tagline = "The black-and-white that is always in your mirror"
personality = "Patrol workhorse. Big, square-shouldered and unhurried until the light bar comes on; then it is a two-tonne brick with a V8 and a push bar. Nothing about it is pretty, everything about it says the shift is long."
silhouette = "Long, flat three-box sedan with an upright windscreen, a tall flat deck and a steel push bar jutting ahead of the nose; full-width light bar mid-roof."
signatures = [
  "Classic black body with white doors and roof",
  "Steel push bar with rubber pads ahead of a black egg-crate grille",
  "Full-width red/blue light bar, A-pillar spotlight, three roof antennas",
  "Black steel wheels with small chrome caps",
]
lighting = "Squared-off swept headlamps with dark bezels, grille strobes, wide horizontal tail lamps; at night the bar and grille strobes flash red/blue."

[palette]
base = "#141619"
accent = "#f1f1ec"
primer = "#5d6066"
alts = ["#f1f1ec", "#1d2a44"]

[paint_overrides]
"door_*" = "accent"
roof = "accent"

[body]
nose_len = 0.30
nose_plan = 0.07
nose_drop = 0.06
tail_len = 0.30
tail_plan = 0.06
tail_drop = 0.04
tumblehome = 0.12
crease = 0.012
crease_at = 0.70
shoulder = 0.05
hood_bulge = 0.02
flare_r = 0.01
ws_bow = 0.03
rear_bow = 0.02

