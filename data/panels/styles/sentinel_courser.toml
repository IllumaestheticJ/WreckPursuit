# Sentinel Courser — style sheet (keys: tools/assets/src/style.rs).
[identity]
tagline = "Highway patrol's panda-painted V8 coupe"
personality = "A muscle coupe drafted into highway patrol: the fastest police unit on an open road, bored in town, hungry on the interstate. Its drivers are the ones with the mirrored sunglasses and the radar gun."
silhouette = "Low long-hood fastback coupe with a shark nose, broad rear haunches and a slim light bar on its short roof."
signatures = [
  "White body with a black bonnet, black doors and a black roof (panda livery)",
  "Slim low-profile light bar, grille strobes, one long antenna",
  "Slit headlamps over a wide mesh grille, lip spoiler",
  "Black ten-spoke wheels, dual exhaust",
]
lighting = "Slit swept headlamps with light-strip underline, red/blue strobes in the grille; three-bar tail lamps."

[palette]
base = "#f1f1ec"
accent = "#141414"
primer = "#5d6066"
