# Sentinel Shade — style sheet (keys: tools/assets/src/style.rs).
[identity]
tagline = "The unmarked car you only notice when it lights up"
personality = "A plain gunmetal full-size sedan with a high-output V8 and nothing on the outside to say police — except the things cops always forget: fleet hubcaps, two roof antennas and a driver-side spotlight. When the hidden strobes start, it is already too close."
silhouette = "Sober three-box full-size sedan, tinted rear glass, no light bar, no push bar."
signatures = [
  "Gunmetal paint, dark-tinted rear glass",
  "Hidden red/blue strobes in the grille and on the dash and rear shelf",
  "The tells: plain fleet hubcaps, a driver-side spotlight, two antennas",
  "Chrome slatted grille, dual exhaust",
]
lighting = "Ordinary swept headlamps by day; at night red and blue strobes flash from the grille, the dash and the rear shelf."

[palette]
base = "#3d4247"
accent = "#1b1b1d"
primer = "#5d6066"
alts = ["#1b1b1d", "#5a3a2a", "#2b3a4a", "#c9cdd1"]

