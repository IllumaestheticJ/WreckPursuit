# Quarry Tipper — style sheet (keys: tools/assets/src/style.rs).
[identity]
tagline = "Twelve tonnes of yellow steel with a gravel attitude"
personality = "A tri-axle dump truck fresh off the quarry run: square, grimy, enormously heavy and slow, with a steel tipper body and a cab guard over its head. Nothing in the city wins a shove against it; nothing in the city wants to try."
silhouette = "Square-nosed conventional cab with big squared fenders, a tall steel tipper body reaching forward over the cab roof, and two rear axles on dual wheels."
signatures = [
  "Construction yellow cab, dark-grey steel tipper",
  "Black bar grille, heavy black steel bumper",
  "Cab guard over the roof, twin exhaust stacks",
  "Tandem rear axle with duals, mud flaps, side fuel tank, steps",
]
lighting = "Square recessed headlamps with amber corners; cab-roof amber markers; low red tail lamps on the tipper corners."

[palette]
base = "#e8a317"
accent = "#4a4f55"
primer = "#5d6066"
alts = ["#c8261e", "#efefea", "#2b5d34"]

[paint_overrides]
"tipper_*" = "accent"
"cab_guard_*" = "accent"

[body]
nose_len = 0.2
nose_plan = 0.06
nose_drop = 0.08
nose_sharp = 1.4
tail_len = 0.05
tail_plan = 0.0
tail_drop = 0.0
tumblehome = 0.05
roof_w = 1.05
arch = "square"
arch_gap = 0.1
flare_f = 0.08
crease = 0.0
bed = "tipper"
bed_height = 3.05
bed_gap = 0.15
bed_floor = 1.45
bed_half_w = 1.22
black_pillars = false

