# Rampart 5.0 — style sheet (keys: tools/assets/src/style.rs).
[identity]
tagline = "Loud, proud and painted competition orange"
personality = "Modern V8 muscle with a shark nose and a fastback roof. Traction-limited, noisy, theatrical and fast in a straight line. Its drivers wave at each other and never at the police."
silhouette = "Long bonnet, short deck, fastback roofline sweeping into a squared-off tail; a forward-leaning shark nose and broad rear haunches."
signatures = [
  "Twin black racing stripes nose to tail",
  "Three vertical tail-lamp bars per side",
  "Angry slit headlamps over a big trapezoid grille, heat-extractor vents on the bonnet",
  "Quad exhaust, black ten-spoke wheels",
]
lighting = "Slit headlamps with a light-strip underline; the tri-bar tail lamps are the signature at night."

[palette]
base = "#e0561b"
accent = "#141414"
primer = "#6d6f6a"
alts = ["#1e6fd0", "#e3b505", "#1b1b1d", "#e8e6dc", "#2c5f2d"]

