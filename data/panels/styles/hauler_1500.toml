# Hauler 1500 — style sheet (keys: tools/assets/src/style.rs).
[identity]
tagline = "The battering ram with a tow hitch"
personality = "Full-size half-ton crew cab with nothing to prove and nothing to lose. It wins every shoving match, clears roadblocks for everyone behind it and leans like a barn door in a fast corner. Chrome where it counts, scuffs everywhere else."
silhouette = "Tall, square-nosed crew-cab pickup: a wall of grille, a flat hood at chest height, a stepped cab-back and a long open bed with flat-top wheel arches."
signatures = [
  "Massive chrome three-bar grille with a thick surround, flanked by tall square headlamps",
  "Open bed with tailgate, chrome step bumper, mud flaps",
  "Tow mirrors on twin arms, running-board steps, flared flat-top arches",
  "Six-spoke chrome wheels on chunky all-terrain tires",
]
lighting = "Big upright headlamp blocks with amber corner markers; tall vertical tail lamps on the bed corners; cab-roof clearance markers."

