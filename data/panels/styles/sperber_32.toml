# Sperber 32 — style sheet (keys: tools/assets/src/style.rs).
[identity]
tagline = "The autobahn sniper in titanium silver"
personality = "A taut 2000s German sport sedan with a silky straight six: precise, composed, a little aloof. It is the car of the driver who brakes later than you and never seems to try. Understated until you look at the four tailpipes."
silhouette = "Compact three-box sedan with a strong shoulder line, a short tidy deck with a lip and a slightly forward-leaning nose."
signatures = [
  "Twin round projector headlamps per side",
  "Small chrome-ringed centre grille above a wide lower intake",
  "Swept L-shaped tail lamps, lip spoiler, side skirts",
  "Quad exhaust, polished ten-spoke wheels",
]
lighting = "Four round lamp rings up front read as a quartet at night; wide swept tail lamps."

[palette]
base = "#9ea6ae"
accent = "#1b1b1d"
primer = "#6d6f6a"
