# Lindwurm 4T — style sheet (keys: tools/assets/src/style.rs).
[identity]
tagline = "Point-and-squirt in any weather"
personality = "A 2010s all-wheel-drive hot hatch with a dual-clutch box: brutally quick off the line, forgiving, sensible, and somehow still fun. Driven by people who own a good rain jacket and leave on time."
silhouette = "Crisp two-box hatch: flat bonnet, sharp shoulder crease running the whole length, near-vertical tailgate topped with a roof spoiler."
signatures = [
  "Slim LED-strip headlamps joined by a single grille bar",
  "Big honeycomb lower intake, rear diffuser",
  "Roof spoiler, quad exhaust (two each side)",
  "Viper green with grey ten-spoke wheels",
]
lighting = "Slim rectangular headlamps with a light-strip underline; crisp rectangular tail lamps wrapping into the tailgate."

[palette]
base = "#86b92e"
accent = "#1b1b1d"
primer = "#6d6f6a"
alts = ["#2a6db0", "#e8e6dc", "#5f6b74", "#1b1b1d"]

[body]
nose_len = 0.32
nose_plan = 0.08
nose_drop = 0.1
nose_sharp = 1.3
tail_len = 0.2
tail_plan = 0.05
tail_drop = 0.03
tail_sharp = 1.3
tumblehome = 0.13
crease = 0.015
crease_at = 0.8
flare_f = 0.015
flare_r = 0.02
roof_bow = 0.015
rear_rake = 0.38
ws_bow = 0.025

[[lamp]]
kind = "head"
x = 0.58
z = 0.6
w = 0.34
h = 0.08
slant = 0.03
bezel = 0.01

[[lamp]]
kind = "drl"
shape = "slit"
x = 0.58
z = 0.55
w = 0.3
h = 0.012

[[lamp]]
kind = "tail"
face = "rear"
x = 0.62
z = 0.68
w = 0.3
h = 0.09
slant = 0.02
bezel = 0.008

[[lamp]]
