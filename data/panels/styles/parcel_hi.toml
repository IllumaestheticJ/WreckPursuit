# Parcel Hi — style sheet (keys: tools/assets/src/style.rs).
[identity]
tagline = "The high-roof courier van, permanently on a deadline"
personality = "A European high-roof delivery van with a frugal diesel and a driver who has 140 drops before six. It stops anywhere, pulls out without looking and somehow always finds the gap. Light on its feet for its size, tall enough to catch every crosswind."
silhouette = "Tall, narrow and slab-sided: a short sloping nose, a deep raked windscreen, then a very tall cargo box that runs flat all the way to the vertical rear doors."
signatures = [
  "White cab and roof over green cargo sides",
  "Tall swept headlamps and a slim two-bar grille",
  "No side glass behind the doors, black bumpers, truck mirrors",
  "Tall vertical tail lamps on the rear corners",
]
lighting = "Tall swept headlamps; full-height tail lamp columns on the rear corners and a high brake light."

[palette]
base = "#f2f2ef"
accent = "#2f8f4e"
primer = "#5d6066"
alts = ["#d4a017", "#c9cdd1", "#2f6f9f", "#8f3b2e"]

[paint_overrides]
box_l = "accent"
box_r = "accent"

[body]
nose_len = 0.5
nose_plan = 0.1
nose_drop = 0.2
nose_sharp = 0.9
tail_len = 0.08
tail_plan = 0.02
tail_drop = 0.0
tail_sharp = 2.0
tumblehome = 0.06
roof_w = 1.05
crease = 0.01
crease_at = 0.6
ws_bow = 0.03
bed = "box"
bed_height = 2.7
blind_rear = true

[[lamp]]
kind = "head"
shape = "swept"
x = 0.72
z = 1.17
w = 0.3
h = 0.16
slant = 0.1
bezel = 0.012

[[lamp]]
kind = "indicator"
x = 0.84
z = 1.0
w = 0.08
h = 0.05

[[lamp]]
kind = "tail"
face = "rear"
x = 0.9
z = 1.1
w = 0.1
h = 0.5

[[lamp]]
kind = "brake3"
face = "rear"
x = 0.0
z = 2.6
w = 0.3
h = 0.04
mirror = false

[parts]
mirrors = "truck"

[parts.grille]
style = "slats"
hw = 0.45
z = 1.19
h = 0.1
bars = 2
intake = [0.6, 0.86, 0.12]

[parts.bumper_f]
style = "rubber"
z = 0.72
h = 0.22
proud = 0.04
wrap = 0.25

[parts.bumper_r]
style = "rubber"
z = 0.76
h = 0.2
proud = 0.05
wrap = 0.2

[wheels]
rim = "steel"
finish = "trim"
rim_frac = 0.6
