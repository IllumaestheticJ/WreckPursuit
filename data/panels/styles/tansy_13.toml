# Tansy 1.3 — style sheet (keys: tools/assets/src/style.rs).
[identity]
tagline = "Everyone's aunt's supermini"
personality = "A cheerful little 2000s city car with a 1.3 that is never in a hurry. Parked on every street, driven gently by everyone, smiled at by nobody — until it blocks the alley you needed."
silhouette = "Tall, short, rounded bubble hatch: big friendly teardrop headlamps, a steep windscreen, a tall roof and a near-vertical tailgate."
signatures = [
  "Big teardrop headlamps and a smiling slot grille",
  "Pastel paint with black plastic bumper strips",
  "Tall tail lamps either side of the tailgate",
  "Plain silver hubcaps",
]
lighting = "Large soft teardrop headlamps and round fogs; tall upright tail lamps."

[palette]
base = "#9fd0d6"
accent = "#1b1b1d"
primer = "#6b6e66"
