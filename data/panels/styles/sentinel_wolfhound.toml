# Sentinel Wolfhound — style sheet (keys: tools/assets/src/style.rs).
[identity]
tagline = "The pursuit specialist that never lets the gap open"
personality = "A modern all-wheel-drive twin-turbo pursuit sedan. Heavier than it looks, stable at speed and relentless: it does not need to out-corner you, it just needs to still be there. Clean, efficient, a little cold."
silhouette = "Modern high-belted sedan with a rising wedge beltline, a fast raked glasshouse, slim low-profile light bar and a push bar."
signatures = [
  "White body with navy doors",
  "Slim low-profile LED light bar and push bar",
  "Narrow swept headlamps with light-strip underline, grille strobes",
  "Black six-spoke wheels",
]
lighting = "Thin swept LED headlamps and grille strobes; wide swept tail lamps and a high brake light."

[palette]
base = "#f1f1ec"
accent = "#18243f"
primer = "#5d6066"
