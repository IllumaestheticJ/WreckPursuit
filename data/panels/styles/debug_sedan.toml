# Debug Sedan — style sheet (keys: tools/assets/src/style.rs).
[identity]
tagline = "The yardstick: plain, honest, unbranded"
personality = "The integration lead's reference sedan. Every number on it is round, every surface is plain, and it exists so everything else has something to be compared to. Wears test-mule grey with yellow calibration mirrors."
silhouette = "Generic mid-size three-box sedan, nothing more and nothing less."
signatures = [
  "Test-mule grey with yellow mirror caps and a yellow roof",
  "Plain rectangular lamps, plain slatted grille",
  "Steel wheels with hubcaps",
]
lighting = "Plain rectangular head and tail lamps."

[palette]
base = "#7a8a99"
accent = "#e8c21c"
primer = "#6b6e66"
alts = ["#c9cdd1", "#4a5560"]

[paint_overrides]
roof = "accent"
"mirror_*" = "accent"

[body]
tumblehome = 0.12
crease = 0.008

[[lamp]]
kind = "head"
x = 0.58
z = 0.63
w = 0.3
h = 0.1
bezel = 0.01

[[lamp]]
kind = "tail"
face = "rear"
x = 0.6
z = 0.7
w = 0.3
h = 0.1

[parts.grille]
style = "slats"
hw = 0.35
z = 0.62
h = 0.09
bars = 3

[parts.exhaust]
style = "single"
x = 0.45
z = 0.25
d = 0.07

[wheels]
rim = "hubcap"
finish = "metal"
