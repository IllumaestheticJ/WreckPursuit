# Junkyard Beater — style sheet (keys: tools/assets/src/style.rs).
[identity]
tagline = "What you drive after the impound took your real car"
personality = "A tired late-80s econobox with 300,000 km, sagging springs and a heater that only does hot. Mismatched door from the scrapyard, primer bonnet, one hubcap rattling. It is humble, honest and a surprisingly good teacher of weight transfer."
silhouette = "Small, upright, square-edged 80s three-box sedan with thin pillars, square wheel arches and black rubber bumpers."
signatures = [
  "Faded sage paint with a grey-primer bonnet and a mismatched blue right front door",
  "Rectangular sealed-beam headlamps with wraparound amber corners",
  "Black rubber bumper strips front and rear",
  "Silver plastic hubcaps, a skinny single tailpipe on the left",
]
lighting = "Dim square sealed beams with big amber corners; plain rectangular tail lamps."

[palette]
base = "#7d8c6a"
accent = "#55708f"
primer = "#a3a49c"
alts = ["#8f3b2e", "#b8b2a2", "#3e4a5c", "#a68a4e"]

[paint_overrides]
hood = "primer"
door_fr = "accent"

[body]
nose_len = 0.2
nose_plan = 0.03
nose_drop = 0.03
nose_sharp = 1.6
tail_len = 0.2
tail_plan = 0.03
tail_drop = 0.02
tail_sharp = 1.6
tumblehome = 0.1
roof_crown = 0.012
arch = "square"
crease = 0.008
crease_at = 0.6
shoulder = 0.03
black_pillars = false

[[lamp]]
kind = "head"
x = 0.5
z = 0.6
w = 0.3
h = 0.11
bezel = 0.012

[[lamp]]
kind = "indicator"
x = 0.71
z = 0.6
w = 0.1
h = 0.1

[[lamp]]
kind = "tail"
face = "rear"
x = 0.58
z = 0.66
w = 0.3
h = 0.11

[[lamp]]
kind = "reverse"
face = "rear"
x = 0.36
z = 0.66
w = 0.1
h = 0.07

[parts]
