# Sentinel Bastion — style sheet (keys: tools/assets/src/style.rs).
[identity]
tagline = "The roadblock on wheels"
personality = "A full-size body-on-frame police SUV. Slowest of the units and it leans like a ship, but it is tall, heavy and almost unstoppable in a shove. Captains park it across junctions; in a chase it ends things by mass."
silhouette = "Tall upright box: blunt square nose behind a heavy push bar, flat sides, near-vertical tailgate, full light bar on a high roof."
signatures = [
  "Navy body with white doors and roof",
  "Heavy push bar, grille strobes, A-pillar spotlight",
  "Full-width light bar and two antennas on a tall flat roof",
  "Black six-spoke wheels in flat-top arches, running-board steps",
]
lighting = "Big square headlamp blocks with amber corners; tall vertical tail lamps on the D-pillars."

[palette]
base = "#1a2744"
accent = "#f1f1ec"
primer = "#5d6066"
alts = ["#141619", "#f1f1ec"]

[paint_overrides]
"door_*" = "accent"
roof = "accent"

[body]
nose_len = 0.25
nose_plan = 0.05
nose_drop = 0.05
nose_sharp = 1.4
tail_len = 0.15
tail_plan = 0.03
tail_drop = 0.01
tail_sharp = 1.6
tumblehome = 0.09
arch = "flat_top"
flare_f = 0.02
flare_r = 0.02
crease = 0.015
crease_at = 0.65
hood_bulge = 0.02

