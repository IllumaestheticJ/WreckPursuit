# Vireo XS — style sheet (keys: tools/assets/src/style.rs).
[identity]
tagline = "The little screamer that lives above 5,300 rpm"
personality = "Late-90s three-door hot hatch: light, eager, cheap to fix and happiest with the tach needle in the red. It is the beater-tier hero every player learns on — scrappy, cheerful, a bit loud for its size."
silhouette = "Short, rounded three-door hatch with a low sloping nose, big glass, a near-vertical hatch and a little roof spoiler on top of it."
signatures = [
  "Swept oval headlamps with clear corner indicators and a thin slatted grille",
  "Tall vertical tail lamps on the hatch corners, roof spoiler",
  "One oversized chrome exhaust can",
  "Silver five-spoke wheels in small arches",
]
lighting = "Teardrop-swept headlamps; tall slim tail lamps that read as two red bars at night."

