# Longhaul Tractor — style sheet (keys: tools/assets/src/style.rs).
[identity]
tagline = "Nine tonnes of chrome and diesel, no trailer required"
personality = "A long-nose sleeper-cab semi tractor running bobtail. Slow off the line, unstoppable once rolling, all chrome stacks and air horns. Its driver has seen every highway in the country at 3 a.m. and has no intention of moving over."
silhouette = "Long sloping bonnet with big swept fenders, a tall cab with a roof fairing over the sleeper, twin chrome stacks, then bare chassis rails with a fifth wheel over a tandem rear axle."
signatures = [
  "Huge chrome bar grille with a heavy surround and a chrome bumper",
  "Twin chrome exhaust stacks, roof air horns, roof fairing over the sleeper",
  "Chrome saddle fuel tanks, cab steps, fifth wheel on bare rails",
  "Tandem rear axle on dual wheels with mud flaps",
]
lighting = "Swept headlamp clusters in the fenders, five amber cab-roof markers; small red tail lamps on the rail ends."

[palette]
base = "#1f4e79"
accent = "#c9ccd0"
primer = "#5d6066"
alts = ["#c8261e", "#efefea", "#1b1b1d", "#2b5d34", "#e8a317"]

