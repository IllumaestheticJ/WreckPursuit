# Weather → visibility, traffic, police and economy modifiers. Owned by workstream 14.
# wp_weather only publishes these numbers; the owning crates apply them (see
# docs/integration/weather.md for the call sites).
#
# Every modifier is a multiplier, given as `[at intensity 0, at intensity 1]` of the regime and
# blended across regime changes like everything else. `wet_road` applies by the mean road
# wetness when it is not raining (after a shower); the more severe of the two wins.

id = "effects"

[visibility]
# AI sight distance multiplier = clamp(visibility_m / reference_sight_m, min, 1) · rain loss,
# with visibility_m = 3.912 / max(fog_per_m, clear_air_per_m) (Koschmieder).
reference_sight_m = 800.0
clear_air_per_m = 0.0001
min_sight_mult = 0.15
rain_sight_loss_per_mm_h = 0.025
max_rain_sight_loss = 0.5

[kinds.Clear]
patrol_speed_cap = [1.0, 1.0]
pursuit_speed_cap = [1.0, 1.0]
crash_incident_rate = [1.0, 1.0]
payout = [1.0, 1.0]
rep = [1.0, 1.0]
traffic_speed = [1.0, 1.0]
traffic_headway = [1.0, 1.0]
traffic_density = [1.0, 1.0]

[kinds.Overcast]
patrol_speed_cap = [1.0, 1.0]
pursuit_speed_cap = [1.0, 1.0]
crash_incident_rate = [1.0, 1.05]
payout = [1.0, 1.02]
rep = [1.0, 1.0]
traffic_speed = [1.0, 0.98]
traffic_headway = [1.0, 1.05]
traffic_density = [1.0, 1.0]

[kinds.LightRain]
patrol_speed_cap = [0.92, 0.88]
pursuit_speed_cap = [0.93, 0.88]
crash_incident_rate = [1.3, 1.6]
payout = [1.10, 1.15]
rep = [1.05, 1.10]
traffic_speed = [0.95, 0.90]
traffic_headway = [1.15, 1.30]
traffic_density = [0.97, 0.92]

[kinds.HeavyRain]
patrol_speed_cap = [0.85, 0.75]
pursuit_speed_cap = [0.85, 0.75]
crash_incident_rate = [1.8, 2.6]
payout = [1.20, 1.35]
rep = [1.10, 1.25]
traffic_speed = [0.85, 0.75]
traffic_headway = [1.40, 1.80]
traffic_density = [0.90, 0.80]

[kinds.Fog]
patrol_speed_cap = [0.90, 0.80]
pursuit_speed_cap = [0.90, 0.80]
crash_incident_rate = [1.3, 1.8]
payout = [1.10, 1.20]
rep = [1.05, 1.15]
traffic_speed = [0.85, 0.70]
traffic_headway = [1.30, 1.60]
traffic_density = [0.95, 0.85]

# [dry road, fully wet road] when it is not raining.
[wet_road]
patrol_speed_cap = [1.0, 0.95]
pursuit_speed_cap = [1.0, 0.95]
crash_incident_rate = [1.0, 1.25]
payout = [1.0, 1.05]
rep = [1.0, 1.0]
traffic_speed = [1.0, 0.95]
traffic_headway = [1.0, 1.15]
traffic_density = [1.0, 1.0]
