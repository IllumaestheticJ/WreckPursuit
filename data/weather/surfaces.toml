# Road water (hydrology) and weather grip per surface. Owned by workstream 14 (wp_weather).
#
# Water is tracked per grid cell as a film depth in mm:
#   wetness  = clamp(water / film_mm, 0, 1)         (0 dry … 1 fully wet film)
#   standing = max(0, water − film_mm)              (drives aquaplaning and puddles)
# Each step (in-game seconds):
#   water += rain − evaporation;  infiltration removes standing water only;  clamp to the cell cap.
#   evaporation = dry_mm_per_h · temp · wind · sun · humidity(kind) · (1 + traffic_drying_gain · occupancy)
#
# Grip multipliers here are WEATHER multipliers: 1.0 on a dry road at mild temperature. They
# multiply the tire's own `surface_multipliers[surface]` (dry tire-vs-surface grip). The
# `wet_factor`s are for the reference street tire; a tire whose WetAsphalt/Asphalt ratio differs
# from `reference_wet_ratio` scales the wet LOSS proportionally (see wp_weather::grip).

id = "surfaces"
reference_wet_ratio = 0.70
film_mm = 0.5
max_water_mm = 10.0
# The interim WorldQuery adapter reports Asphalt as WetAsphalt at or above this wetness.
interim_wet_threshold = 0.5

# Evaporation modifiers.
dry_temp_ref_c = 15.0
dry_temp_gain_per_c = 0.04
dry_temp_min = 0.15
dry_wind_gain_per_mps = 0.08
dry_sun_gain = 1.0
dry_humidity = { Clear = 1.0, Overcast = 0.7, LightRain = 0.15, HeavyRain = 0.05, Fog = 0.3 }

# Traffic: busy lanes dry first (tires squeegee and spray the water off).
traffic_drying_gain = 1.5
traffic_occupancy_cap = 2.0
# Occupancy is an exponential moving average of vehicles per cell, in in-game seconds.
traffic_tau_game_s = 300.0

# Puddle-prone cells (dips, blocked drains): chance per cell × surface puddle_weight.
puddle_cell_fraction = 0.06
puddle_capacity_mm = [3.0, 9.0]

# Road temperature effects (tire temperature is out of scope).
cold_ref_c = 10.0
cold_loss_per_c = 0.004
cold_min = 0.92
ice_temp_c = 0.0
ice_band_c = 1.5
ice_factor = 0.18
# Below this wetness a freezing road is just cold, not icy.
ice_min_wetness = 0.2

# Painted lane markings / zebra crossings: grip factors used by `marking_grip_multiplier`
# (the `[surfaces.PaintedLine]` row below carries the same wet loss).
marking_dry_factor = 0.97
marking_wet_factor = 0.50

[aquaplane]
# No aquaplaning below this standing-water depth.
min_depth_mm = 0.5
ref_depth_mm = 3.0
ref_width_m = 0.205
# Onset speed at ref depth/width: onset = base · sqrt(ref_depth / depth) · sqrt(ref_width / width).
onset_treaded_mps = 24.0
onset_slick_mps = 15.0
onset_min_mps = 11.0
onset_max_mps = 60.0
# Loss ramps from 0 at onset to full at onset · full_at_onset_ratio (smoothstep).
full_at_onset_ratio = 1.3
max_grip_loss = 0.85
# Depth at which the loss reaches its maximum (shallower water planes less completely).
full_loss_depth_mm = 4.0

[surfaces.Asphalt]
wet_factor = 0.70
film_capacity_mm = 1.5
dry_mm_per_h = 0.6
infiltration_mm_per_h = 0.5
puddle_weight = 1.0

# The tire table already prices in "wet" for this surface; weather adds no further wet loss.
[surfaces.WetAsphalt]
wet_factor = 1.0
film_capacity_mm = 1.5
dry_mm_per_h = 0.6
infiltration_mm_per_h = 0.5
puddle_weight = 1.0

[surfaces.Concrete]
wet_factor = 0.74
film_capacity_mm = 1.2
dry_mm_per_h = 0.7
infiltration_mm_per_h = 0.5
puddle_weight = 0.6

[surfaces.Gravel]
wet_factor = 0.88
film_capacity_mm = 2.0
dry_mm_per_h = 0.5
infiltration_mm_per_h = 6.0
puddle_weight = 0.5

[surfaces.Grass]
wet_factor = 0.62
film_capacity_mm = 3.0
dry_mm_per_h = 0.3
infiltration_mm_per_h = 4.0
puddle_weight = 0.3

# Packed dirt turns to mud.
[surfaces.Dirt]
wet_factor = 0.58
film_capacity_mm = 4.0
dry_mm_per_h = 0.35
infiltration_mm_per_h = 2.0
puddle_weight = 1.5

# Kerbs are painted.
[surfaces.Curb]
wet_factor = 0.55
film_capacity_mm = 0.8
dry_mm_per_h = 0.8
infiltration_mm_per_h = 0.0
puddle_weight = 0.0

# Metal plates, rails, manhole covers, bridge joints.
[surfaces.Metal]
wet_factor = 0.40
film_capacity_mm = 0.6
dry_mm_per_h = 0.9
infiltration_mm_per_h = 0.0
puddle_weight = 0.0

# Painted lane markings / zebra crossings (contract v0.3.0 `SurfaceType::PaintedLine`, W-3).
# Sealed paint on the road: wet loss matches `marking_wet_factor`, a thin film that drains and
# dries like a kerb, no infiltration. Puddles collect on it like the asphalt around it.
[surfaces.PaintedLine]
wet_factor = 0.50
film_capacity_mm = 0.8
dry_mm_per_h = 0.8
infiltration_mm_per_h = 0.0
puddle_weight = 1.0
