# Arcade damage table = Simulation (sim.toml) with per-kind damage scales (see below).
# Same code path, different numbers. Owned by workstream 03 (damage) for tuning.
#
# Owner request 2026-10-22: "make arcade damage 20% of what it is now ... for the player and AI
# drivers only. Traffic and police vehicles still receive full damage." Every line below is
# identical to sim.toml (which holds the previous Arcade numbers), so traffic and police cars
# behave exactly as in Simulation. The only difference is racer_damage_scale: wp_sim scales the
# contact impulses reaching the damage model of the player's racer and AI racers by it.
# 0.25, not 0.2: the lattice takes the first part of a hit elastically, so a quarter of the
# impulse leaves about a fifth of the damage. Measured (debug_sedan barrier sweep, `cargo run
# --release -p wp_damage --bin damage-barrier -- --sweep`), Arcade as a share of Simulation at
# 56 / 80 km/h: health lost frontal 22 % / 20 %, offset 21 % / 19 %, side 16 % / 20 %, rear
# 12 % / 19 %; plastic (crumple) energy 18-23 %. At 0.2 it was only 12-16 %. Light-hit and
# limp-mode rules are the same as Simulation.
mode = "Arcade"
racer_damage_scale = 0.25              # racers take ~20 % of the damage; traffic full
# Owner request 2026-10-26: "make AI police damage 2X current value on arcade mode, make AI racer
# damage also 2X". AI racers take racer_damage_scale x ai_racer_damage_mult of the impulse
# (0.5); the player's racer keeps 0.25. AI police take police_damage_scale (2.0, they had full
# 1.0). Set either back to 1.0 to undo. Damage only: physics is untouched.
ai_racer_damage_mult = 2.0             # AI racers: 2x the player's share
police_damage_scale = 2.0              # AI police: 2x full damage
impulse_to_lattice_scale = 0.45
plasticity_scale = 0.8
beam_break_scale = 1.5
component_damage_scale = 0.24
component_fail_threshold_scale = 4.0
total_loss_health = 0.1
cabin_intrusion_total_loss_m = 0.78
repair_cost_scale = 0.5
wheel_detach_scale = 0.42
engine_kill_on_total_loss = true
global_health_from_intrusion = true
