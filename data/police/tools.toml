# Roadblocks, spike strips, helicopter, racer-side radar/scanner (wp_police::tools).

helo_request_cooldown_s = 60.0
captain_order_hold_s = 20.0

[roadblock]
min_ahead_m = 300.0
max_ahead_m = 700.0
min_sight_m = 120.0
units = [2, 3]
barrier_half_extents_m = [1.2, 0.3, 0.5]
barrier_mass_kg = 400.0
unit_mass_kg = 1700.0
lifetime_s = 90.0
# Never on highways when the wanted level is above this.
highway_max_level = 3
max_active = 1
[roadblock.cooldown_s]
dawn = 60.0
day = 40.0
dusk = 60.0
night = 90.0

[spikes]
min_ahead_m = 150.0
max_ahead_m = 500.0
min_sight_m = 120.0
length_m = 7.0
deflate_s = 1.0
lifetime_s = 60.0
max_active = 2
[spikes.cooldown_s]
dawn = 30.0
day = 20.0
dusk = 30.0
night = 45.0

[helicopter]
speed_mps = 55.0
altitude_m = 120.0
# Spotlight beam (drawing / captain view only): about a 15 m pool from 120 m up.
spotlight_half_angle_rad = 0.12
max_track_s = 240.0
# While it keeps visual the helicopter radios the racer's position this often (the radio's
# unit_gap_s also limits it), s. Ground units chase the position it sees.
position_report_s = 30.0
# Visual is "lost" (radio line) after this long without line of sight: bridge decks, tunnels,
# tall buildings and parking structures hide a car from the air. Short gaps (a lamp post's worth
# of building edge) do not count, s.
lost_visual_after_s = 3.0
[helicopter.los_range_m]
dawn = 450.0
day = 500.0
dusk = 450.0
night = 350.0

[gadgets]
# Index = tier (0 = basic).
radar_range_m = [150.0, 300.0, 500.0]
scanner_delay_s = [10.0, 6.0, 3.0]
radio_log_len = 256
