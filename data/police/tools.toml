# Roadblocks, spike strips, helicopter, racer-side radar/scanner (wp_police::tools).

helo_request_cooldown_s = 60.0
captain_order_hold_s = 20.0

[roadblock]
min_ahead_m = 300.0
max_ahead_m = 700.0
min_sight_m = 120.0
unit_mass_kg = 1700.0
lifetime_s = 90.0
# Never on highways when the wanted level is above this.
highway_max_level = 3
max_active = 1
# Arcade-classic-style roadblocks (owner 2026-10-31): police cars parked at an angle across the
# road, nose to nose or staggered, with gaps between them. One entry per wanted level, L1 first.
# cars: front-line cars (more on a road too wide, fewer on one too narrow); heavy: how many are
# heavy units (the heaviest police model: much harder to shove), nearest the middle first;
# gap_m: planned gap width (>= 2.5 m, a car width plus a little); spiked_gaps: gaps with a spike
# strip in front (more than there are = all); second_line_chance: chance of a second, staggered
# line 14 m behind.
[[roadblock.tiers]]
cars = 2
heavy = 0
gap_m = 4.5
spiked_gaps = 0
second_line_chance = 0.0
[[roadblock.tiers]]
cars = 2
heavy = 0
gap_m = 4.0
spiked_gaps = 0
second_line_chance = 0.0
[[roadblock.tiers]]
cars = 3
heavy = 0
gap_m = 3.0
spiked_gaps = 1
second_line_chance = 0.0
[[roadblock.tiers]]
cars = 3
heavy = 2
gap_m = 2.8
spiked_gaps = 9
second_line_chance = 0.35
[[roadblock.tiers]]
cars = 4
heavy = 3
gap_m = 2.7
spiked_gaps = 9
second_line_chance = 0.7
[roadblock.cooldown_s]
dawn = 60.0
day = 40.0
dusk = 60.0
night = 90.0

[spikes]
min_ahead_m = 150.0
max_ahead_m = 500.0
min_sight_m = 120.0
length_m = 7.0
deflate_s = 1.0
lifetime_s = 60.0
max_active = 2
# The spike car and strip appear already set up: out of every racer's view and at least
# appear_min_m away, or (a long straight in plain view) at least appear_far_m away.
appear_min_m = 250.0
appear_far_m = 600.0
[spikes.cooldown_s]
dawn = 30.0
day = 20.0
dusk = 30.0
night = 45.0

[helicopter]
speed_mps = 55.0
altitude_m = 120.0
# Spotlight beam (drawing / captain view only): about a 15 m pool from 120 m up.
spotlight_half_angle_rad = 0.12
max_track_s = 240.0
# While it keeps visual the helicopter radios the racer's position this often (the radio's
# unit_gap_s also limits it), s. Ground units chase the position it sees.
position_report_s = 30.0
# Visual is "lost" (radio line) after this long without line of sight: bridge decks, tunnels,
# tall buildings and parking structures hide a car from the air. Short gaps (a lamp post's worth
# of building edge) do not count, s.
lost_visual_after_s = 3.0
[helicopter.los_range_m]
dawn = 450.0
day = 500.0
dusk = 450.0
night = 350.0

[gadgets]
# Index = tier (0 = basic).
radar_range_m = [150.0, 300.0, 500.0]
scanner_delay_s = [10.0, 6.0, 3.0]
radio_log_len = 256
