# Patrol presence, reinforcement, helicopter availability and tool unlocks (wp_police::dispatch).
# Day: dense patrols, fast reinforcement, full toolset. Night: sparse, slow, helicopter iffy.

max_ground_units = 24
# A civilian-civilian contact faster than this creates a crash-scene incident.
crash_incident_min_speed_mps = 8.0
# Owner (2026-10-23): police do not engage random AI cars across the map. When the sim says who
# the players are, AI racers (street racers, roamers) are police business only while a race is on
# or within this distance of a player; a wanted one that drives off farther is dropped (its
# pursuit called off). Crash scenes are only opened this close to a player too (m).
npc_scope_m = 350.0

# Patrol units per district per phase, for a district with patrol_reference_km of road
# (highways included): a district with more or less road gets proportionally more or fewer
# (rounded, at least 1 where the table has any), all districts together at most max_patrols.
# So the tables are a density: Core by day 8 / 12.8 km = 0.63 units per km of road, Suburb
# 3 / 25.8 = 0.12, Industrial 2 / 11.7 = 0.17. The reference sizes are the procedural 12x12
# grid's; Port Vesper by day gets 8 / 6 / 2, Ashpeak's ~180 km hit max_patrols.
[patrols.core]
dawn = 2
day = 8
dusk = 6
night = 3

[patrols.suburb]
dawn = 1
day = 3
dusk = 2
night = 1

[patrols.industrial]
dawn = 1
day = 2
dusk = 2
night = 1

# A crash scene keeps one unit busy this long.
[patrol_reference_km]
core = 12.8
suburb = 25.8
industrial = 11.7

[max_patrols]
dawn = 6
day = 16
dusk = 12
night = 7

[crash_scene_s]
dawn = 180.0
day = 240.0
dusk = 180.0
night = 120.0

[reinforcement]
# Ground units on one racer per wanted level L1..L5 (owner playtest row 64: L1 2, L2 4, L3 6,
# L4+ 8). Idle and patrolling units within backup_radius_m by road join at once and drive to
# the racer's predicted position; the rest spawn out of sight ahead of / around the racer
# after response_s.
units_per_level = [2, 4, 6, 8, 8]
backup_radius_m = [450.0, 600.0, 800.0, 1100.0, 1500.0]
# Units on the racer farther than backup_radius_m + far_margin_m (straight line) don't count
# toward the level's units (so closer ones spawn), and are stood down if still that far
# far_release_s after joining.
far_margin_m = 250.0
far_release_s = 20.0
# Below this level backup comes only from the racer's own district.
backup_all_districts_level = 2
# High-bounty racers get reinforcements up to this much sooner.
priority_max_reduction = 0.3
# Reinforcements spawn like responders ([response] window, out of sight); if no hidden spot
# is in that window: the nearest node at least this far from the racer, out of its sight.
spawn_min_distance_m = 350.0
# Row 84: while a racer is lost (Searching) this many more units per level L1..L5 come to the
# last known position (spawned out of sight around it and its likely exits).
search_extra_units = [1, 2, 2, 3, 3]

# Reinforcement spawn delay (uniformly sampled), s: the time a unit that wasn't nearby takes to
# get into the area. Short by day, longer at night.
[reinforcement.response_s.dawn]
min = 8.0
max = 16.0
[reinforcement.response_s.day]
min = 4.0
max = 10.0
[reinforcement.response_s.dusk]
min = 6.0
max = 14.0
[reinforcement.response_s.night]
min = 12.0
max = 30.0

# Response to reckless-driving calls (owner playtest 2026-10-20: "the police spawn too far").
# A violation no unit saw is a call (civilian or traffic camera). After the call delay the
# nearest available unit within radius_m takes it; if there is none, a responder spawns out
# of every racer's sight, spawn_min_m..spawn_max_m along the roads (legal driving distance),
# ahead of the racer where possible, and drives at it with lights on. Target: first unit
# within 100 m of the racer 10-25 s after the call in Core by day.
[response]
spawn_min_m = 150.0
spawn_max_m = 350.0
# A fast racer stretches spawn_max_m by this many seconds of its travel (to get ahead of it).
spawn_lead_s = 6.0
# Never appear or vanish closer than this to any racer (straight line), m.
never_closer_m = 120.0
# Ground units allowed at once by the highest wanted level L0..L5 (patrols included, and
# never more than max_ground_units). Responders and reinforcements wait for room.
max_units_by_level = [16, 18, 20, 22, 24, 24]
# Idle responders / reinforcements / surplus patrols despawn out of sight and this far away.
despawn_min_m = 150.0
# A call's unit still farther than redispatch_far_m from the racer redispatch_s after taking
# it is released and the call dispatched again (the racer turned away from it).
redispatch_s = 6.0
redispatch_far_m = 150.0
# Who calls (2026-10-23, "not overly sensitive"): a violation no unit saw becomes a call only
# when a civilian vehicle was within call_witness_m of it (or a traffic camera flagged it; worlds
# that report no traffic to the police count as always having a caller), and only when it is
# more than trivial: speeding at least call_min_over_mps over, a collision with the racer moving
# at least call_min_collision_mps (red lights, wrong way and reckless driving always count).
call_witness_m = 80.0
call_min_over_mps = 5.5
call_min_collision_mps = 4.0
# A call is dropped this long after the last report about it, s (was a fixed 180 s), and is
# dispatched again at most max_redispatches times (each one sends the unit to where the call
# put the racer, with the velocity it was reported at, never the racer's real one).
call_ttl_s = 60.0
max_redispatches = 2

# Call taken -> unit assigned, s.
[response.call_delay_s]
dawn = 3.0
day = 2.0
dusk = 3.0
night = 3.0

# Added per district (stations are downtown), s.
[response.district_delay_s]
core = 0.0
suburb = 4.0
industrial = 6.0

# An available unit closer than this takes the call; otherwise one spawns, m.
[response.radius_m]
core = 300.0
suburb = 450.0
industrial = 500.0

[helicopter]
# Owner decision (playtest row 156, 2026-10-23): roadblocks from wanted level 3, spike strips
# from 4, the helicopter from 5.
min_level = 5
[helicopter.count]
dawn = 1
day = 1
dusk = 1
night = 1
[helicopter.launch_s]
dawn = 90.0
day = 45.0
dusk = 70.0
night = 120.0
[helicopter.unavailable_chance]
dawn = 0.15
day = 0.0
dusk = 0.1
night = 0.25

# Wanted level (1..=5) at which tools / tactics unlock.
[unlocks]
spikes_level = 4
roadblock_level = 3
pit_level = 2
boxin_level = 1
rolling_block_level = 3
