to = 0.95
count = 2
into_m = 25.0
units = 1

[[ashpeak_downtown_checkpoint.stakeouts]]
at = 0.3
trigger_m = 60.0

[[ashpeak_downtown_checkpoint.stakeouts]]
at = 0.8
trigger_m = 60.0

