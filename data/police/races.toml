# recognise the field as it flies past; PIT and rams on the straight, nothing on the road.
[harbor_dash]
name = "On-ramp radar"
summary = "Radar units on the boulevard and the ramp pick you up at once. Nothing on the road, but they chase hard."
presence = 1.0
backup_scale = 1.0
tool_lifetime_s = 0.0
recognise_on_sight = true

[harbor_dash.tactics]
roadblocks = false
spikes = false
helicopter = false
box_in = false
rolling_block = true
junction_block = false
pit = true
rams = true

[[harbor_dash.stakeouts]]
at = 0.5
trigger_m = 80.0

