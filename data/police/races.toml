# Night hill sprint up six hairpins to the Knob Observatory Lot. Proposed style: summit trap.
# Hairpins make a rammed chase pointless and deadly, so the police tail the field up the hill
# without PITs or rams, seal the side roads near the top, and box the racers in at the
# observatory lot. The trap springs at the top: a unit waits just below the summit and lights
# the field up as it arrives (springing it lower down stops a pulled-over racer on the
# one-lane hairpins, and the whole field behind it with him).
[hollins_sprint]
name = "Summit trap"
summary = "Let them climb, then spring the trap: side roads at the top sealed, a unit waiting below the summit, box-ins at the lot. No rams on the hill."
presence = 1.0
backup_scale = 1.0
tool_lifetime_s = 300.0
recognise_on_sight = true

[hollins_sprint.tactics]
roadblocks = false
spikes = false
helicopter = true
box_in = true
rolling_block = false
junction_block = true
pit = false
rams = false

[[hollins_sprint.side_blocks]]
from = 0.6
to = 1.0
count = 2
into_m = 25.0
units = 1

[[hollins_sprint.stakeouts]]
at = 0.88
trigger_m = 50.0

