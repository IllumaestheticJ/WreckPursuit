offset_m = 2.5

# ---- Ashpeak County (PR #50, ported on lead/ashpeak-port). County roads are worked by the
# Ashpeak County Sheriff's Office units (county livery; same AI). Each table below has its
# style and its race_picker measurement (police on at the table's own presence, seeds 1-8;
# docs/integration/police.md, "Ashpeak race profiles"). One lesson runs through them: on the
# county's one-lane hairpins, gravel and tower grid, anything that stops the AI field ahead
# of it (a route block's gap, junction blocks, a unit pulling onto the road, a patrol head-on)
# gets the whole field arrested in a queue, so these profiles start their chases from
# staked-out units that know the field on sight and keep the dynamic stops off.

# Midnight touge up Crowfoot Pass's hairpins. Style: mountain tail. The deputies leave the
# climb alone and set the net at the saddle: almost no patrols on the pass (presence 0.1) and
# two units staked out just below the top that know the field on sight. A chase that starts
# there follows the racers, never passes them: no rams, PITs, box-ins, rolling or junction
# blocks on the one-lane hairpins, pursuers close only to the racer's own speed
# (speed_margin 0), and no helicopter (it called units in head-on at intercept speed, where
# they wedged on the hairpin walls and pinned the field behind them, row 168).
# Measured (race_picker, police on, seeds 1-8): finishers 4,1,3,4,4,4,3,4 of 4, 1-4 pursuits
# a race, every capture at the saddle (gate 17). With the old profile (presence 1.0, the
# helicopter and box-ins on) patrols on the pass caught the whole field on every seed.
[crowfoot_ascent]
name = "Mountain tail"
summary = "The pass is quiet, but deputies wait below the saddle: they know you on sight, follow you over the top and never pass on the hairpins."
presence = 0.1
backup_scale = 0.5
tool_lifetime_s = 300.0
recognise_on_sight = true

[crowfoot_ascent.tactics]
roadblocks = false
spikes = false
helicopter = false
box_in = false
rolling_block = false
junction_block = false
pit = false
rams = false

[crowfoot_ascent.speed]
speed_margin = 0.0

[[crowfoot_ascent.stakeouts]]
at = 0.9
trigger_m = 60.0

[[crowfoot_ascent.stakeouts]]
at = 0.95
trigger_m = 60.0

# Downhill touge from the Crowfoot saddle. Proposed style: valley net. Nobody chases down the
# hairpins; the net is at the foot of the pass, where the road meets town.
[crowfoot_descent]
name = "Valley net"
summary = "No chase down the hairpins; units wait at the foot of the pass and block the junction into town."
presence = 1.0
backup_scale = 1.0
tool_lifetime_s = 300.0
recognise_on_sight = false

[crowfoot_descent.tactics]
roadblocks = false
spikes = false
helicopter = false
box_in = true
rolling_block = false
junction_block = true
pit = false
rams = false

[[crowfoot_descent.stakeouts]]
at = 0.9
trigger_m = 60.0

# Dusk run over Harnell Flats' gravel section roads. Style: open country. Thin patrols out on
# the farm roads (presence 0.5, row 168), so the county works the run from one fixed point: a
# deputy parked on the approach to Harnell Crossing who knows the field on sight, with the
# helicopter spotting for the chase and the crossings blocked once it is on. No spikes, PITs
# or rams on gravel. Earlier in the run (a deputy at 0.35) the chase lasted 2 km and caught
# the whole field together at 3.3-3.5 km on 4 of 8 seeds.
# Measured (race_picker, police on, seeds 1-8): 4-5 pursuits every race, finishers 4 of 4 on
# 7 seeds (3 on seed 6, the fourth out of time). The old profile drew no pursuit at all.
[harnell_dirt_run]
name = "Open country"
summary = "Thin patrols on the section roads, but a deputy waits outside Harnell Crossing and the helicopter spots for him."
presence = 0.5
backup_scale = 0.5
tool_lifetime_s = 300.0
recognise_on_sight = true

[harnell_dirt_run.tactics]
roadblocks = true
spikes = false
helicopter = true
box_in = false
rolling_block = true
junction_block = true
pit = false
rams = false

[[harnell_dirt_run.stakeouts]]
at = 0.85
trigger_m = 80.0

# Illegal daytime checkpoint run through Ashpeak City's downtown. Style: downtown crackdown,
# the county's answer to Port Vesper's Lantern lockdown: maximum presence in daylight, the
# side streets off the back half sealed so the field has to run the avenue to the Spire, and
# units staked out at the checkpoints that know the field on sight. As on the Lantern run the
# police may take the whole field (owner brief for illegal daytime). No roadblock across the
# route: the AI field cannot thread its gap and was arrested queued at it on every seed.
# Measured (race_picker, police on, seeds 1-8): 4-5 pursuits every race; the whole field
# finishes on half the seeds (2, 3, 5, 6) and is taken on the other half.
[ashpeak_downtown_checkpoint]
name = "Downtown crackdown"
