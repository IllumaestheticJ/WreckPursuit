# Back down the Hollins hairpins. Style: the summit trap's mirror. No rams or PITs on the hill
# (deadly on hairpins); a unit waits near the bottom and side roads may be sealed there.
[hollins_descent]
name = "Bottom of the hill"
summary = "They let you come down, then wait at the bottom: junction blocks and a unit near Mercer. No rams on the hill."
presence = 1.0
backup_scale = 1.0
tool_lifetime_s = 300.0
recognise_on_sight = true

[hollins_descent.tactics]
roadblocks = false
spikes = false
helicopter = true
box_in = false
rolling_block = false
junction_block = true
pit = false
rams = false

[[hollins_descent.stakeouts]]
