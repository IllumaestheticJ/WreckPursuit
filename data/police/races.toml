# Two night laps of the downtown block grid. Style: block grid. The towers' grid swallows a
# chase: no rams, PITs, box-ins, rolling or junction blocks between the buildings (a racer
# stopped there by a unit is arrested, and the rest of the field queues behind it, row 168),
# pursuers close only to the racer's speed, and thin patrols (presence 0.15). The pursuits
# come from a unit staked out on the back of the lap that knows the field on sight, so every
# lap draws a chase the field can shake in the grid. Thinning the patrols alone (1.0 -> 0.4)
# and every tactic mix tried still lost the whole field on most seeds.
# Measured (race_picker, police on, seeds 1-8): 6-9 pursuits every race, all six finish on
# 7 seeds (5 of 6 on seed 4, one captured).
[ashpeak_metro_circuit]
name = "Block grid"
summary = "A deputy watches the back of the lap and the chase is on every time round; nobody rams between the towers, so lose them in the grid."
presence = 0.15
backup_scale = 0.5
tool_lifetime_s = 300.0
recognise_on_sight = true

[ashpeak_metro_circuit.tactics]
roadblocks = false
spikes = false
helicopter = false
box_in = false
rolling_block = false
junction_block = false
pit = false
rams = false

[ashpeak_metro_circuit.speed]
speed_margin = 0.0

[[ashpeak_metro_circuit.stakeouts]]
