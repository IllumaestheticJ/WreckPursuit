# first wanted level; the captain's roadblocks from level 2 and spikes from 3; two scripted
# roadblocks across the loop with one lane open, a spike strip over the outer half of the road,
# the on-ramps sealed and six units waiting on the shoulders. PIT and rams at highway speed.
