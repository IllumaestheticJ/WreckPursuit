# Off Loop 9 at dusk and through town's lights ("cops patrol here"). Style: patrolled streets:
# the normal night's patrols and every dynamic tactic, nothing scripted. On lead/round12's map
# the course is 2.3 km of signals (1.6 km on main's), and stakeouts or more patrols on top had
# the police capture the whole field on most seeds (race_picker offramp_sprint), so this table
# stays at the normal level: the red lights draw the patrols by themselves.
[offramp_sprint]
name = "Patrolled streets"
summary = "A patrol zone: run the red lights and the units on the beat come for you. Every tactic is on the table."
presence = 1.0
backup_scale = 1.0
tool_lifetime_s = 300.0
recognise_on_sight = false

# Across the grid city's blocks to the highway grid. Style: block patrol, normal presence, a
# unit at the arterial's midpoint, junction blocks allowed in the grid.
[grid_arterial_sprint]
name = "Block patrol"
summary = "A normal night in the grid: one unit watching the arterial, junction blocks if it turns into a chase."
presence = 1.0
backup_scale = 1.0
tool_lifetime_s = 300.0
recognise_on_sight = false

[[grid_arterial_sprint.stakeouts]]
at = 0.5
trigger_m = 60.0
