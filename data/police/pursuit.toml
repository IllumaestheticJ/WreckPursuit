# Patrol and pursuit driving (wp_police::pursuit). Chases are slow, calculated and lethal to both
# sides: pursuers are capped, plan corners conservatively and spend a risk budget.

think_hz = 10.0
patrol_speed_factor = 1.0
respond_speed_factor = 1.6
# Pursuit speed = min(target speed * (1 + target_speed_margin), pursuit_cap_mps[phase]).
target_speed_margin = 0.10
patrol_cornering_g = 0.35
pursuit_cornering_g = 0.65
shadow_cornering_g = 0.45

[pursuit_cap_mps]
dawn = 36.0
day = 40.0
dusk = 36.0
night = 32.0

# Ground unit line-of-sight range (headlights at night).
[los_range_m]
dawn = 200.0
day = 260.0
dusk = 200.0
night = 140.0

[unit]
accel_mps2 = 4.0
brake_mps2 = 6.5
grip_g = 0.95
crash_offset_m = 7.0
# Health lost per (impact speed m/s)^2 / 1000. Simulation: a 25 m/s impact is a total loss.
crash_health_per_kmps2 = { arcade = 0.8, simulation = 1.7 }
contact_health_per_kmps2 = { arcade = 1.0, simulation = 2.5 }
# At or below this health the unit is a total loss (Simulation: one hard hit ends it).
total_loss_health = { arcade = 0.0, simulation = 0.25 }

[risk]
budget = 10.0
lateral_g = 0.7
cost_per_s_lateral = 1.0
cost_near_miss = 1.5
cost_collision = 4.0
regen_per_s = 0.05

# Built-in traffic hazard model for the headless driver (replaced by real traffic contacts).
[hazard]
speed_exponent = 2
collision_chance_at_2x = 0.12
collision_speed_fraction = { min = 0.2, max = 0.9 }
[hazard.near_miss_per_km]
dawn = 0.5
day = 1.5
dusk = 1.0
night = 0.3

[tactics]
shadow_m = { min = 25.0, max = 40.0 }
boxin_max_kmh = 60.0
boxin_offset_m = [2.6, 6.0]
rolling_block_lead_m = 18.0
rolling_block_speed_factor = 0.85
intercept_horizon_s = { min = 10.0, max = 20.0 }
intercept_min_gap_m = 150.0
# Arcade health levels off around 0.2-0.3 under repeated hits and rarely gets below 0.1-0.23,
# so Arcade units stay in the chase until properly wrecked (lead round 8, H's note).
disengage_health = { arcade = 0.15, simulation = 0.4 }
bent_wheel_toe_rad = 0.02
puncture_pull_over = 0.5

# Pursuit aggression by wanted level (owner playtest row 63, 2026-10-20: "police are not
# aggressive enough", "noticeably harder"). Arrays are L1..L5. One set of values for both damage
# modes (owner rule: Arcade and Simulation differ only in car damage). This departs from the
# PVPD doctrine's "contain, don't race" on purpose; see docs/integration/police.md.
#   L1 traffic stop: tail close, box in when slow.
#   L2 PIT as soon as the road allows (straight ahead), rear-quarter rams otherwise, a second
#      unit flanks alongside.
#   L3+ hard rams and side slams, rolling blocks with units ahead, junctions blocked ahead.
[chase]
cornering_g = 0.92
brake_mps2 = 8.5
speed_margin = 0.25
cap_scale = [1.0, 1.1, 1.2, 1.25, 1.3]
shadow_min_m = [10.0, 6.0, 4.0, 4.0, 4.0]
shadow_max_m = [18.0, 12.0, 8.0, 8.0, 8.0]
civilian_clear_m = [25.0, 10.0, 6.0, 3.0, 0.0]
risk_budget_scale = [1.5, 2.5, 4.0, 6.0, 10.0]
tactic_contact_cost = 1.0
pit_max_kmh = [0.0, 100.0, 130.0, 150.0, 170.0]
pit_min_straight_m = 40.0
pit_side_offset_m = 1.9
pit_turn_in_gap_m = 3.2
reengage_s = 2.5
rear_ram_level = 2
hard_ram_level = 3
flank_level = 2
flank_offset_m = 2.6
ram_closing_mps = [4.0, 1.5, 7.0]
junction_block_level = 3

# Obstacle awareness: units follow, wait behind or pass any vehicle in their lane, and spawn
# clear of other vehicles (wp_police::avoid).
[avoid]
standstill_gap_m = 3.0
reaction_s = 0.4
decel_mps2 = 4.0
lateral_margin_m = 0.35
bumper_m = 4.0
min_horizon_m = 20.0
max_horizon_m = 90.0
stopped_mps = 1.0
pass_gap_m = 12.0
pass_wait_s = 6.0
pass_wait_siren_s = 1.5
pass_shift_m = 3.5
pass_extra_shift_m = 0.9
pass_clear_m = 8.0
oncoming_clear_m = 50.0
pass_speed_mps = 9.0
pass_creep_mps = 2.0
pass_creep_gap_m = 1.0
# Traffic rules. Without lights: stop at reds (and yellows with room), slow to yield_mps through
# unsignalised junctions, no overtaking near a junction. With lights: run reds, but slowly.
junction_lookahead_m = 90.0
stop_line_back_m = 7.0
junction_slow_m = 8.0
yield_mps = 5.0
turn_mps = 3.5
siren_turn_mps = 6.0
siren_junction_mps = 11.0
siren_red_mps = 6.0
no_pass_near_junction_m = 25.0
# Give way to cross traffic (patrol at unsignalised junctions, lights at a red).
yield_radius_m = 40.0
yield_lookahead_m = 30.0
yield_gap_s = 2.5
box_radius_m = 7.0
yield_max_s = 8.0
yield_max_siren_s = 3.0
# Units waiting on each other: after this the lower unit id creeps on.
gridlock_s = 2.0
# Pursuing / intercepting units drive at the limit: through junctions fast, reds barely
# slowed, a short look for cross traffic, and quick passes.
chase_junction_mps = 18.0
chase_red_mps = 13.0
chase_turn_mps = 9.0
chase_yield_max_s = 0.6
chase_decel_mps2 = 7.5
chase_lateral_margin_m = 0.0
chase_pass_wait_s = 0.5
# Push-through (owner playtest row 61): blocked by a stopped civilian or parked car for
# push_after_s with lights on and no way past, shove it aside below 15 km/h; if that does not
# move it, back out / re-route / respawn as for any stuck unit.
push_after_s = 1.5
push_mps = 3.5
push_max_s = 3.0
push_min_progress_m = 1.5
push_cooldown_s = 6.0
# Static feelers (owner playtest row 66): rays ahead and either side against building
# footprints and tunnel walls; brake to stop short of a wall, steer away from one at the side.
wall_margin_m = 6.0
wall_feeler_rad = 0.4
wall_decel_mps2 = 7.0
wall_shift_m = 1.2
spawn_clear_m = 25.0
spawn_path_s = 5.0
spawn_path_half_width_m = 6.0
