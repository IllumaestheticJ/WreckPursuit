# Patrol and pursuit driving (wp_police::pursuit). Chases are slow, calculated and lethal to both
# sides: pursuers are capped, plan corners conservatively and spend a risk budget.

think_hz = 10.0
patrol_speed_factor = 1.0
respond_speed_factor = 1.15
# Pursuit speed = min(target speed * (1 + target_speed_margin), pursuit_cap_mps[phase]).
target_speed_margin = 0.10
patrol_cornering_g = 0.35
pursuit_cornering_g = 0.65
shadow_cornering_g = 0.45

# Raised ×1.5 (2026-10-20) when the police cars got the street-spec power rebalance: at
# 40 m/s every street-spec racer outran the cap in 7-12 s and could not be caught on a straight.
[pursuit_cap_mps]
dawn = 54.0
day = 60.0
dusk = 54.0
night = 48.0

# Ground unit line-of-sight range (headlights at night).
[los_range_m]
dawn = 200.0
day = 260.0
dusk = 200.0
night = 140.0

[unit]
# Kinematic (headless) driver acceleration; the doctrine tests in crates/wp_police/scenarios
# are calibrated on it.
accel_mps2 = 4.0
# AI units driven as physical cars without lights (patrol, returning; with lights the [pro]
# driver uses the car's own limits): ceiling on the speed-reference ramp. 4.0 → 5.0 →
# 6.0 (2026-10-21) with the police street-spec power rebalance: 6.0 = wp_world::drive's
# full-pedal acceleration; slower cars saturate it and resync. 6.0 first exposed a traffic-stop
# queue (fixed in wp_opponent) and a patrol gridlock (fixed: boxed-in units turn round), and
# golden_city_chase was re-aimed (docs/integration/police.md).
physical_accel_mps2 = 6.0
brake_mps2 = 6.5
grip_g = 0.95
crash_offset_m = 7.0
# Health lost per (impact speed m/s)^2 / 1000. Simulation: a 25 m/s impact is a total loss.
crash_health_per_kmps2 = { arcade = 0.8, simulation = 1.7 }
contact_health_per_kmps2 = { arcade = 1.0, simulation = 2.5 }
# At or below this health the unit is a total loss (Simulation: one hard hit ends it).
total_loss_health = { arcade = 0.0, simulation = 0.25 }

[risk]
budget = 10.0
lateral_g = 0.7
cost_per_s_lateral = 1.0
cost_near_miss = 1.5
cost_collision = 4.0
regen_per_s = 0.05

# Built-in traffic hazard model for the headless driver (replaced by real traffic contacts).
[hazard]
speed_exponent = 2
collision_chance_at_2x = 0.12
collision_speed_fraction = { min = 0.2, max = 0.9 }
[hazard.near_miss_per_km]
dawn = 0.5
day = 1.5
dusk = 1.0
night = 0.3

[tactics]
shadow_m = { min = 25.0, max = 40.0 }
boxin_max_kmh = 60.0
boxin_offset_m = [2.6, 6.0]
pit_max_kmh = { arcade = 70.0, simulation = 55.0 }
pit_min_straight_m = 60.0
pit_engage_m = 12.0
pit_cooldown_s = 8.0
rolling_block_lead_m = 18.0
rolling_block_speed_factor = 0.85
intercept_horizon_s = { min = 10.0, max = 20.0 }
intercept_min_gap_m = 150.0
# Arcade health levels off around 0.2-0.3 under repeated hits and rarely gets below 0.1-0.23,
# so Arcade units stay in the chase until properly wrecked (lead round 8, H's note).
disengage_health = { arcade = 0.15, simulation = 0.4 }
bent_wheel_toe_rad = 0.02
puncture_pull_over = 0.5

# Obstacle awareness: units follow, wait behind or pass any vehicle in their lane, and spawn
# clear of other vehicles (wp_police::avoid).
[avoid]
standstill_gap_m = 3.0
reaction_s = 0.4
decel_mps2 = 4.0
lateral_margin_m = 0.35
bumper_m = 4.0
min_horizon_m = 20.0
max_horizon_m = 90.0
stopped_mps = 1.0
pass_gap_m = 12.0
pass_wait_s = 6.0
pass_wait_siren_s = 1.5
pass_shift_m = 3.5
pass_extra_shift_m = 0.9
pass_clear_m = 8.0
oncoming_clear_m = 50.0
pass_speed_mps = 9.0
pass_creep_mps = 2.0
pass_creep_gap_m = 1.0
# Traffic rules. Without lights: stop at reds (and yellows with room), slow to yield_mps through
# unsignalised junctions, no overtaking near a junction. With lights: run reds, but slowly.
junction_lookahead_m = 90.0
stop_line_back_m = 7.0
junction_slow_m = 8.0
yield_mps = 5.0
turn_mps = 3.5
siren_turn_mps = 6.0
siren_junction_mps = 11.0
siren_red_mps = 6.0
no_pass_near_junction_m = 25.0
# Give way to cross traffic (patrol at unsignalised junctions, lights at a red).
yield_radius_m = 40.0
yield_lookahead_m = 30.0
yield_gap_s = 2.5
box_radius_m = 7.0
yield_max_s = 8.0
yield_max_siren_s = 3.0
# Units waiting on each other: after this the lower unit id creeps on.
gridlock_s = 2.0
# Not chasing anyone and stopped this long behind a stopped vehicle it cannot pass (a busted
# car parked in the junction mouth, a jam): turn around onto another route. Time at a red or
# yellow light does not count.
reroute_after_s = 20.0
# ...backing out first for up to this long (a car cannot turn round from standstill nose to
# tail with something).
reroute_reverse_s = 3.0
spawn_clear_m = 25.0
spawn_path_s = 5.0
spawn_path_half_width_m = 6.0

# Pro driving of physical units (wp_police::pro, lead P8): racing line inside the own-direction
# lanes (plus junction boxes), speed profile at the grip limit (car limits x usage x road grip x
# damage x confidence), late braking, slide control. Patrol keeps its lane, patrol_cornering_g and
# unit.brake_mps2; obstacle awareness and junction rules above still cap the speed.
[pro]
# Sentinel Cruiser, measured (skidpad g, 100-0 decel g, 0-100 mean accel, top speed), street
# spec (2026-10-21; was 0.83 / 0.98 / 4.35 / 72.4 before the power rebalance).
default_limits = { lat_g = 0.84, brake_g = 0.99, accel_mps2 = 4.95, top_speed_mps = 82.3 }
lat_usage = 0.95
brake_usage = 0.92
window_m = 220.0
step_m = 3.0
edge_margin_m = 0.5
half_width_m = 0.95
lane_width_m = 3.5
opposing_m = 0.5
corner_round_passes = 12
traffic_clear_m = 80.0
replan_s = 0.25
smooth_sweeps = 30
curvature_sweeps = 60
lookahead_base_m = 2.0
lookahead_per_mps = 0.33
lookahead_min_m = 5.0
lookahead_max_m = 30.0
speed_gain = 2.5
lead_s = 0.15
slip_deadband_rad = 0.05
countersteer_gain = 0.8
slide_slip_rad = 0.12
slide_throttle = 0.25
# 0.3 → 0.2 (2026-10-21): the floor is pedal, not force, and the street-spec cruiser (888 N·m)
# pushed wide at 0.3 out of wet corners (police_pace::police_drive_clean_in_the_wet grazed the
# wall in 7 of 9 perturbed runs; clean in all at 0.2, dry pace still ahead of the race AI).
exit_throttle_min = 0.2
confidence_drop = 0.05
confidence_min = 0.8
confidence_regain_per_s = 0.02
run_wide_m = 1.2
turn_around_mps = 4.0
stuck_s = 1.5
reverse_s = 2.5
reverse_min_s = 1.5
