# Police radio pacing (wp_police::radio). Sim seconds; no wall clock.
#
# Playtest row 6 ("the dispatcher and cops are way too talkative"): budget <= 4 lines/min with
# nobody wanted, <= 10 lines/min in a hot pursuit (wp_police scenarios radio_*.ron check it).
# Playtest row 79 ("cops don't talk with each other"): units call out what they see
# (wp_police::chatter), one transmission at a time, a bit more chatter as the wanted level
# rises. Level 1 keeps the row-6 gaps.
#
# Playtest row 144 ("filtering between important and unimportant information"): five priority
# tiers (wp_police::radio::RadioTier), high to low:
#   1 actionable    roadblock / spikes planned (where, how far ahead), helicopter launching /
#                   arriving / losing the racer, a unit intercepting ahead. No gap; cuts any
#                   lower line; waits only for a transmission, not the silence after it.
#   2 escalation    pursuit start / end, level up / down, tougher department, rams authorised,
#                   captain orders. No gap; cuts tiers 3-5.
#   3 impact        rams, PITs, units hit / wrecked, civilian crashes. impact_gap_s; shouted.
#   4 investigation calls, searching, lost visual, eyes on, bumper, box-in. global_gap_s.
#   5 routine       resuming patrol, clear, out of service. routine_gap_s, routine_quiet_s,
#                   dropped while anything more important waits.
# Deployment lines (units joining, responding to a known call, backup) are not spoken; at
# L0-L1 one "units responding" summary when heat first rises.
#
# Simplified 2026-10-23 (audio audit): plain words (no "10-80", "Code 4", "EMS", "PIT",
# "check the cover"), the player is "the suspect", no per-unit "copy, searching" or helicopter
# position reports, no routine chatter, only lines that concern the player (see relevant_m).

# After any spoken line, no tier 4 line for this long, by the highest wanted level of any racer
# (L1..L5), s. L1 = the row-6 value.
global_gap_s = [8.0, 6.5, 5.0, 4.0, 3.5]
# ... and (tiers 4-5) while nobody is wanted, s.
global_gap_calm_s = 20.0
# After any spoken line, no tier 5 (routine) line for this long, by wanted level (L1..L5), s:
# routine chatter thins out as heat rises.
routine_gap_s = [10.0, 14.0, 20.0, 30.0, 45.0]
# No routine line within this long after a tier 1-3 line, s.
routine_quiet_s = 6.0
# After any spoken line, no tier 3 (impact) line for this long, s.
impact_gap_s = 0.4
# One unit says at most one tier 4-5 line per this long, by wanted level (L1..L5; nobody wanted
# uses L1), s. L1 = the row-6 value.
unit_gap_s = [30.0, 22.0, 16.0, 12.0, 10.0]
# Grouped lines wait this long so duplicates from several units merge into one, s.
collapse_window_s = 1.0
# Held tier 4-5 lines older than this are dropped (callouts may set their own life), s.
stale_s = 6.0
# Held tier 1-2 lines older than this are dropped, s.
stale_critical_s = 15.0
# Held tier 3 lines older than this are dropped (bigger impacts set a longer life), s.
impact_stale_s = 4.0
# With nobody wanted, routine chatter plays only from units within this range of a racer, m.
earshot_m = 200.0

# Owner (2026-10-23): "police should not be engaging random AI cars on the other side of the
# map, and it definitely should not be polluting the radio channel". The radio is the player's
# (PoliceSystem::set_listeners, set by wp_sim to the player cars): a line about another racer
# is heard only while that racer, the place or the speaking unit is within relevant_m of a
# player; impact lines (tier 3) only within impact_m of one. Headless scenarios without
# listeners hear everything.
relevant_m = 300.0
impact_m = 250.0
# Line budget per minute (any 60 s window), by the players' state: [calm, wanted or searching,
# in pursuit]. Tiers 3-5 wait while the last minute already had this many lines; tiers 1-2
# always get through (and count).
max_lines_per_min = [2.0, 4.0, 6.0]
# Tier 5 (routine) lines: "clear and available", "resuming patrol", unrelated crash scenes,
# backup requests. Off: no gameplay value (2026-10-23).
routine = false

# One transmission at a time: a line keeps the channel for words / words_per_s + line_pad_s,
# then min_gap_s of silence. words_per_s and line_pad_s match wp_audio's scanner
# (data/audio/audio_config.json) so the spoken lines never overlap either.
min_gap_s = 2.5
# ... and this much after a shouted tier 3 line (impacts come thick and fast), s.
impact_min_gap_s = 0.8
words_per_s = 2.6
line_pad_s = 0.7

# "Tougher department" sentence added to dispatch's level summary when a pursued racer reaches
# level 1..5 ("" = none). Rams sentences come from data/police/pursuit.toml's ram levels.
takeover = [
    "",
    "",
    "Highway Patrol is taking over the pursuit.",
    "Heavy units authorised.",
    "Tactical units authorised, all units, stop him by any means.",
]

# Impact severity (wp_police::chatter::impact_severity): collision energy 1/2 * impulse *
# closing speed, J. Below hit_j a contact is a tap (no line). Energy alone is at most heavy:
# only a unit the damage model wrecked gets a wreck line ("officer down", "I'm done!").
[impact]
hit_j = 6000.0
heavy_j = 30000.0
# Unit health at or below this makes any real hit at least heavy.
heavy_health = 0.45
# Mass for contacts without an impulse (headless proximity contacts), kg.
nominal_mass_kg = 1500.0
# One impact line per unit per this long unless a worse one follows, s.
unit_gap_s = 3.0
# One "he took out a civilian" line per racer per this long, s.
civilian_gap_s = 8.0
