# Heat, wanted levels, escape / capture / safehouse rules and bounty (wp_police::heat).
# Every day/night difference is a [*.dawn/day/dusk/night] table; nothing is hard-coded.
# Units: seconds, metres, heat points (0..max_heat).

[heat]
max_heat = 100.0
# Heat at which wanted levels L1..L5 begin.
level_thresholds = [10.0, 30.0, 50.0, 70.0, 90.0]
# A violation nobody saw (no unit / camera with line of sight) counts at this fraction ("reports").
unseen_factor = 0.2
# The same violation kind from the same racer is counted at most once per this period.
repeat_cooldown_s = 1.0
# Seconds after the last sighting before heat starts to decay.
decay_grace_s = 5.0
# Long chases escalate: heat per second while actively pursued (seen).
pursuit_heat_per_s = 0.25
# Disabling a police unit by contact.
cop_disabled_heat = 15.0

# Hitting a police car is assaulting an officer (owner playtest row 24): heat jumps to at least
# `min_level` and the hit unit, plus units within `nearby_units_m` that can see the racer,
# recognise it at once (no recognition_time_s wait), so a pursuit starts immediately, day or night.
# A racer-unit contact counts when, within one episode (contacts closer than `episode_s`), the
# summed impulse and the two cars' relative speed reach these and the racer itself was moving.
# Measured with physical cars in wp_sim / simcli (debug_sedan vs a stopped sentinel_cruiser):
#   glancing flank sideswipe at 30-50 km/h: 1-5 contacts of 50-660 N·s, 220-1,500 N·s in all,
#     normal closing only 0.7-2.1 m/s, relative speed 8.3-13.9 m/s;
#   harder sideswipes / corner hits at 30-50 km/h: 2,500-12,500 N·s, 2.7-13.8 m/s;
#   5 km/h parking bump: 860 N·s, relative speed 1.4 m/s; 8 km/h: 1,900 N·s, 2.2 m/s.
# So the relative speed is what separates a hit from a nudge; the impulse floor (3x wp_sim's
# 50 N·s contact-event floor) only drops feather touches. Only physics contacts count: headless (internally driven) units have no
# collider, so their proximity stand-in never is an assault.
[heat.assault]
min_impulse_ns = 150.0
min_rel_speed_mps = 2.5
min_racer_speed_mps = 2.5
episode_s = 0.5
repeat_cooldown_s = 3.0
heat = 20.0
min_level = 2
nearby_units_m = 60.0

# Blatant speeding right past a unit (owner playtest rows 60 / 80): a speeding violation this
# far over the limit within range_m of an in-service unit that can see it (oncoming, parked or
# driving the same way) is recognised at once: wanted >= min_level and a pursuit by that unit.
# Row 80: 20 km/h over within 90 m (was 40 km/h within 60 m; a pass at 20-40 km/h over made the
# racer wanted with no chase).
[heat.blatant]
over_mps = 5.5
range_m = 90.0
min_level = 1

# Field of view of a ground unit (row 89): line of sight within the phase's range (below) in a
# forward cone this wide, and all round this close (mirrors).
[heat.sight]
fov_deg = 200.0
all_round_m = 60.0

# Recognising an already-wanted car the unit did not see offend (rows 80 / 89):
# recognition_time_s within near_m, + far_extra_s at the edge of recognition_range_m (linear).
# Out of sight the timer drains at decay_per_s instead of resetting.
[heat.recognition]
near_m = 150.0
far_extra_s = 2.0
decay_per_s = 0.5

[heat.violation]
speeding_base = 2.0
speeding_per_mps = 0.4
red_light = 6.0
wrong_way = 4.0
collision = 8.0
reckless = 3.0

# Owner playtest row 89, "if I can see them, they can see me": a unit with line of sight within
# this range witnesses a violation (was 70-160 m). Headlights and street lights make a moving
# car visible far at night too. Fog and rain shorten it further through the weather sight range
# (wp_weather's line_of_sight cap, the same one the renderer's fog follows).
[heat.witness_range_m]
dawn = 320.0
day = 380.0
dusk = 320.0
night = 260.0

# A unit with line of sight within this range recognises a wanted car and starts a pursuit (the
# same range: what it can see it can recognise, given time; was 40-250 m).
[heat.recognition_range_m]
dawn = 320.0
day = 380.0
dusk = 320.0
night = 260.0

# ...after this many seconds of sight within heat.recognition.near_m (longer further out, see
# [heat.recognition]). Only for a wanted car the unit did not see offend: a witnessed violation
# that makes the racer wanted starts the pursuit at once (row 80).
[heat.recognition_time_s]
dawn = 0.8
day = 0.5
dusk = 0.8
night = 1.0

# Heat lost per second while unseen and not pursued. Faster at night.
[heat.decay_per_s]
dawn = 0.5
day = 0.35
dusk = 0.5
night = 0.7

# Multiplier on decay by district (Suburb/Industrial cool off faster).
[heat.decay_district_scale]
core = 1.0
suburb = 1.6
industrial = 1.5

[escape]
# Seconds without any unit (or helicopter) line of sight needed to escape, per wanted level L1..L5.
base_s = [12.0, 16.0, 22.0, 30.0, 40.0]

[escape.phase_scale]
dawn = 0.9
day = 1.0
dusk = 0.9
night = 0.7

[capture]
stop_speed_mps = 2.0
stop_time_s = 4.0
unit_radius_m = 15.0
# Boxed in / pinned (owner playtest row 63): rocking back and forth within this radius for
# pinned_time_s with a unit close is a capture too.
pinned_radius_m = 4.0
pinned_time_s = 6.0

[safehouse]
dwell_s = 10.0
clear_radius_m = 150.0
heat_scale_on_enter = 0.25

[bounty]
per_heat_second = 2.0
per_race_won_wanted = 500.0
per_cop_disabled = 250.0
max_priority_bounty = 20000.0

# Race payout / stake multiplier by phase (night pays more).
[bounty.payout_scale]
dawn = 1.2
day = 1.0
dusk = 1.2
night = 1.6
