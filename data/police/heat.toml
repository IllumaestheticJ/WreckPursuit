# Heat, wanted levels, escape / capture / safehouse rules and bounty (wp_police::heat).
# Every day/night difference is a [*.dawn/day/dusk/night] table; nothing is hard-coded.
# Units: seconds, metres, heat points (0..max_heat).

[heat]
max_heat = 100.0
# Heat at which wanted levels L1..L5 begin.
level_thresholds = [10.0, 30.0, 50.0, 70.0, 90.0]
# A violation nobody saw (no unit / camera with line of sight) counts at this fraction ("reports").
unseen_factor = 0.2
# The same violation kind from the same racer is counted at most once per this period.
repeat_cooldown_s = 1.0
# Seconds after the last sighting before heat starts to decay.
decay_grace_s = 5.0
# Long chases escalate, but only while the racer keeps offending (row 157, "heat escalates far
# too quickly"): heat per second while pursued and seen, and only with a violation counted in the
# last pursuit_heat_window_s (a pursued car driving legally gains nothing from chase time).
# Was 0.25/s for any seen pursuit time.
pursuit_heat_per_s = 0.08
pursuit_heat_window_s = 10.0
# Violations by a racer already pursued count at this fraction (the chase itself is the
# escalation; at 20 m/s over, L1 -> L5 takes ~2.5 min of flat-out driving instead of ~40 s).
pursued_violation_factor = 0.25
# Disabling a police unit by contact.
cop_disabled_heat = 15.0

# Hitting a police car is assaulting an officer (owner playtest row 24): heat jumps to at least
# `min_level` and the hit unit, plus units within `nearby_units_m` that can see the racer,
# recognise it at once (no recognition_time_s wait), so a pursuit starts immediately, day or night.
# A racer-unit contact counts when, within one episode (contacts closer than `episode_s`), the
# summed impulse and the two cars' relative speed reach these and the racer itself was moving.
# Measured with physical cars in wp_sim / simcli (debug_sedan vs a stopped sentinel_cruiser):
#   glancing flank sideswipe at 30-50 km/h: 1-5 contacts of 50-660 N·s, 220-1,500 N·s in all,
#     normal closing only 0.7-2.1 m/s, relative speed 8.3-13.9 m/s;
#   harder sideswipes / corner hits at 30-50 km/h: 2,500-12,500 N·s, 2.7-13.8 m/s;
#   5 km/h parking bump: 860 N·s, relative speed 1.4 m/s; 8 km/h: 1,900 N·s, 2.2 m/s.
# So the relative speed is what separates a hit from a nudge; the impulse floor (3x wp_sim's
# 50 N·s contact-event floor) only drops feather touches. Only physics contacts count: headless (internally driven) units have no
# collider, so their proximity stand-in never is an assault.
[heat.assault]
min_impulse_ns = 150.0
min_rel_speed_mps = 2.5
min_racer_speed_mps = 2.5
episode_s = 0.5
repeat_cooldown_s = 3.0
heat = 20.0
min_level = 2
nearby_units_m = 60.0

# Blatant speeding right past a unit (owner playtest rows 60 / 80): a speeding violation this
# far over the limit within range_m of an in-service unit that can see it (oncoming, parked or
# driving the same way) is recognised at once: wanted >= min_level and a pursuit by that unit.
# Row 80: 20 km/h over within 90 m (was 40 km/h within 60 m; a pass at 20-40 km/h over made the
# racer wanted with no chase). 2026-10-23 ("not overly sensitive"): 30 km/h over within 60 m.
[heat.blatant]
over_mps = 8.3
range_m = 60.0
min_level = 1

# Field of view of a ground unit (row 89; narrowed for the 2026-10-23 "realistic view distance"
# request): line of sight within the phase's notice range (pursuit.toml [los_range_m]) in a
# forward cone this wide, and all round this close (mirrors). Inside `focus_fov_deg` (the
# windscreen) awareness builds at full rate; in the rest of the cone (side windows) at
# `peripheral_factor`.
[heat.sight]
fov_deg = 160.0
all_round_m = 25.0
focus_fov_deg = 120.0
peripheral_factor = 0.5

# Perception (owner 2026-10-23: "cops see through walls / re-engage too easily"). Each unit has
# an awareness of each racer, 0..1. While the unit has line of sight in its cone within the notice
# range it rises by dt / t, where t is near_s within near_m, rising linearly to identify_s at the
# phase's identify range (identify_range_m) and to notice_s at the notice range (los_range_m),
# x time_scale[phase]; out of sight it falls at decay_per_s (slowly: a unit that loses the car
# round a corner for a second picks it up again at once, but separate glimpses a second or more
# apart don't add up to an identification). A unit with awareness 1:
#   - within identify_range_m IDENTIFIES the racer: recognises a wanted car (pursuit start),
#     re-acquires a lost one (Searching -> Pursuit) and refreshes what police know;
#   - within los_range_m (any awareness) a unit TRACKS a car it is already chasing: an ongoing
#     pursuit stays in sight; a lost one (Searching) is only found again by identification.
# A one-frame glimpse does nothing; re-acquiring takes >= 0.25 s close, ~2 s at 250 m by day.
# The helicopter identifies after helo_s of line of sight. Units that do not see the racer
# themselves plan on the radioed position, refreshed every radio_share_s.
# A violation a unit witnesses starts its pursuit at once only within witness_pursuit_m;
# farther away it counts in full and the unit has to identify the car first.
[heat.awareness]
near_m = 40.0
near_s = 0.25
identify_s = 2.0
notice_s = 4.0
decay_per_s = 0.25
helo_s = 0.5
radio_share_s = 1.0
witness_pursuit_m = 150.0
[heat.awareness.time_scale]
dawn = 1.2
day = 1.0
dusk = 1.2
night = 1.5

# A racer-civilian contact (wp_world `Collision`, any box overlap) counts only when the racer
# itself was moving at least this fast: a car rear-ended at a light is not the offender
# (contract request CR-police-1 for a real relative-speed / at-fault field).
[heat.collision]
min_racer_speed_mps = 3.0

# Radar (owner report 2026-10-21, "cops are seeing me but not triggering pursuit"): a unit that
# can see a racer (sight, line of sight, witness range) clocks it. Over the limit where it drives
# by more than max(margin_mps, ratio x limit) is a witnessed speeding violation. wp_world only reports speeding against a lane pointing the car's way,
# every 5 s: on the wrong side of the road, or between two reports, a speeder was seen but never
# clocked. Same margins as wp_world's detector. Only racers not wanted yet are clocked (a wanted
# racer a unit sees is recognised and pursued anyway).
[heat.radar]
margin_mps = 2.24
ratio = 0.1
# Clock only when no speeding counted for this long (wp_world's repeat): the same heat rate as
# the world's reports, just never missed while a unit watches.
repeat_s = 5.0
# Speeding in sight this long before it is clocked (wp_world's hold). The limit is the higher
# of the lane's and the police road graph's (at a junction the lane can be the cross street).
hold_s = 1.0
# 2026-10-23: a radar is a beam, not the whole field of view. Only patrolling / idle units
# clock, within range_m and within beam_deg of straight ahead or straight behind the unit.
beam_deg = 20.0
[heat.radar.range_m]
dawn = 220.0
day = 250.0
dusk = 220.0
night = 200.0

[heat.violation]
speeding_base = 2.0
speeding_per_mps = 0.4
red_light = 6.0
wrong_way = 4.0
collision = 8.0
reckless = 3.0

# Owner playtest row 89 asked for symmetric sight (380 m); the owner's 2026-10-23 request
# ("realistic view distance") supersedes it: a unit NOTICES a car out to pursuit.toml
# [los_range_m] but must IDENTIFY it (see [heat.awareness]) within this range to recognise it,
# re-acquire it or witness a violation. Fog and rain shorten it further through the weather
# sight range (wp_weather's line_of_sight cap, the same one the renderer's fog follows).
[heat.witness_range_m]
dawn = 200.0
day = 250.0
dusk = 200.0
night = 150.0

[heat.identify_range_m]
dawn = 200.0
day = 250.0
dusk = 200.0
night = 150.0

# Heat lost per second while unseen and not pursued. Faster at night.
[heat.decay_per_s]
dawn = 0.5
day = 0.35
dusk = 0.5
night = 0.7

# Multiplier on decay by district (Suburb/Industrial cool off faster).
[heat.decay_district_scale]
core = 1.0
suburb = 1.6
industrial = 1.5

[escape]
# Seconds without any unit (or helicopter) line of sight needed to escape, per wanted level L1..L5.
base_s = [12.0, 16.0, 22.0, 30.0, 40.0]

[escape.phase_scale]
dawn = 0.9
day = 1.0
dusk = 0.9
night = 0.7

[capture]
stop_speed_mps = 2.0
stop_time_s = 4.0
unit_radius_m = 15.0
# Boxed in / pinned (owner playtest row 63): rocking back and forth within this radius for
# pinned_time_s with a unit close is a capture too.
pinned_radius_m = 4.0
pinned_time_s = 6.0
# ... with a unit within this range (wider than unit_radius_m: a racer stuck in a jam, the
# police held up behind other cars 20 m away, is captured, not waited for forever; Hollins
# hairpin, lead/opponent-pace).
pinned_unit_radius_m = 30.0

[safehouse]
dwell_s = 10.0
clear_radius_m = 150.0
heat_scale_on_enter = 0.25

[bounty]
per_heat_second = 2.0
per_race_won_wanted = 500.0
per_cop_disabled = 250.0
max_priority_bounty = 20000.0

# Race payout / stake multiplier by phase (night pays more).
[bounty.payout_scale]
dawn = 1.2
day = 1.0
dusk = 1.2
night = 1.6
