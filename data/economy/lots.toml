# Car lots: dealerships, used car lots and junkyards (wp_economy::lots). Owned by workstream 08.
#
# Every lot restocks each in-game day from a seeded roll of (lot id, day): `slots` parking
# spaces, each filled with chance `fill_chance` by a roster model the lot carries (class in
# `classes`, base price in [`min_base_price`, `max_base_price`]). Dealerships show each model at
# most once, so on a given day some models are simply not on the floor.
#
#   Dealership  brand new: full health, new tyres, priced at the New market price × price_scale.
#   UsedLot     running cars with wear (body dents, tired parts, worn tyres) in the lot's
#               condition band; priced from the Used market price, lower for rougher cars.
#   Junkyard    barely running or dead (engine, gearbox, driveshaft or battery), missing panels,
#               bald or flat tyres. What is wrong under the bonnet is hidden until you buy it.
#               Sometimes a rare variant (a model with factory / previous-owner mods) turns up.
#
# Repairs fix everything the lot car came with except the tyres: tyres are replaced
# separately (`[tires]`), Repair All never touches them.

[tires]
# Price of one replacement tyre (fitted), by class.
price_per_tire = { Beater = 70, Compact = 95, Sport = 190, Muscle = 170, Exotic = 480, Truck = 150, PoliceCruiser = 140, PoliceInterceptor = 200, PoliceSuv = 170 }
# Grip of a fully bald tyre relative to a new one (tread 0 → this, tread 1 → 1.0, linear).
bald_grip = 0.72
# Tread below this is reported as "bald" in the garage.
bald_below = 0.15
# Tread lost per hour of driving (0.06 → about 16 hours of driving from new to bald).
wear_per_hour = 0.06

