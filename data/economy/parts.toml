# Garage workshop part slots (wp_economy::parts). Owned by the garage workstream.
#
# A slot is a place on the car that holds one part. Fields:
#   id          unique snake_case id
#   name        display name (generic, no trademarks)
#   group       UI grouping (PartGroup)
#   set         slots sharing a set (the four wheels) take the same kind of part; a mod line on
#               a set counts as installed only when every slot of the set holds that grade
#   repair      the damage line that gives the fitted part its condition, and that a fresh part
#               clears ({ Region = "..." } or { Component = "..." })
#   puncture    corner index 0-3 (FL, FR, RL, RR) whose tyre puncture gives the condition
#   lines       mod lines whose parts fit here (data/mods); each line belongs to one slot or set
#   required    the car cannot leave the garage while this slot is empty
#   blocked_by  slots that must be empty before this one can be worked on (removal order)
#   stock_price price of a stock replacement part when the slot has no `repair` line (the
#               damage price table prices the others)
#   optional    no stock part: the slot is empty on a stock car and only takes aftermarket
#               parts (a turbo, a wing)
#   parent      the assembly slot this part lives inside (engine internals: parent = "engine").
#               It leaves with the assembly and can be worked on in the car or on the stand.
#               Stock internals belong to an engine family (the stock engine's car model, or the
#               swap engine's mod id) and fit only that family.
#   damage_share  how much of the assembly's damage this part takes as wear (wear rises by
#               damage_share x the rise in the assembly's repair-line severity)
#   torque_loss fraction of engine torque lost when the part is fully worn
#   wear_limit  most wear the part can have for the assembly to count as rebuilt (default 0.05)
#
# Mod lines that are not in any slot (paint, vinyls, tyre width, brake pads, gadgets...) stay plain
# upgrades bought through the mod tree.

