# Career progression: reputation tiers, what each tier unlocks, betting limits.
# Owned by the career workstream (wp_economy::progression). Read by wp_race (city betting),
# the touge workstream (touge betting, pink slips, boss races) and the testbed garage.
#
# Rep scale (stakes.toml): a night-time win is ~170 rep, a clean win ~200, a capture costs
# 50-600. The scripted mid-skill racer (3 races a night) makes ~250 rep a night, reaching
# Street in ~2 nights, Known in ~8, Respected in ~20, Feared in ~40 and Legend in ~80; boss and
# touge wins on top shorten that (see tests/progression.rs::tier_pacing).
#
# Tiers are decided by *current* rep, so a bad night (capture, DNFs) can drop you a tier and
# lock its features again. The one-off `reward` credits are paid the first time a tier is
# reached (tracked by the account's peak tier), never twice.
#
# max_bet: the largest single stake at this tier (0 = no betting). A stake is also capped at
# `max_bet_cash_frac` of the cash on hand, and betting is blocked while in debt.

max_bet_cash_frac = 0.5

[[tiers]]
tier = "Unknown"
name = "Unknown"
min_rep = 0
reward = 0
max_bet = 0

[[tiers]]
tier = "Street"
name = "Street Racer"
min_rep = 500
reward = 2000
max_bet = 1000

[[tiers]]
tier = "Known"
name = "Known Name"
min_rep = 2000
reward = 5000
max_bet = 3000

[[tiers]]
tier = "Respected"
name = "Respected"
min_rep = 5000
reward = 12000
max_bet = 8000

[[tiers]]
tier = "Feared"
name = "Feared"
min_rep = 10000
reward = 25000
max_bet = 20000

[[tiers]]
tier = "Legend"
name = "Street Legend"
min_rep = 20000
reward = 50000
max_bet = 60000

# Lowest tier at which each feature is open.
[unlocks]
city_races = "Unknown"
city_betting = "Street"
touge_races = "Known"
touge_betting = "Known"
boss_races = "Respected"
pink_slips = "Respected"
# Head-to-head bets with the roaming street racers (honk to challenge). Open from the start
# (round12 player flow); the racer's level sets the stake range, cash is the only other cap.
street_betting = "Unknown"

# Exact rep for a feature whose gate sits inside its tier (must be within that tier's range).
# Owner call 2026-10-26: touge side bets and pink slips open at half their old rep, side bets
# at 2 500 (was Respected, 5 000) and pink slips at 5 000 (Respected; was Feared, 10 000).
[unlock_rep]
touge_betting = 2500

# Lowest tier at which the dealer sells each class. Police classes are never for sale.
# Every class is open from the start (owner calls 2026-10-24 for Exotic, 2026-10-26 for the
# rest): price is the only gate.
[class_unlocks]
Beater = "Unknown"
Compact = "Unknown"
Truck = "Unknown"
Sport = "Unknown"
Muscle = "Unknown"
Exotic = "Unknown"

# The player's own garages (owner request 2026-10-27): career runs start from one of them, picked
# in the career menu. A garage opens for good the first time rep reaches its tier (Unknown 0,
# Known 2 000, Respected 5 000); where each one stands in the world is wp_wasm's
# `garage_visit::HOME_GARAGES`, by id. First = open from the start, then in unlock order.
[[home_garages]]
id = "vesper_lockup"
name = "Dockside Lock-up"
tier = "Unknown"

[[home_garages]]
id = "spire_loft"
name = "Spire Basement Garage"
tier = "Known"

[[home_garages]]
id = "harnell_barn"
name = "Harnell Barn"
tier = "Respected"
