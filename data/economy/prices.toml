# Labour hours for a full replacement (× severity, at least 10%). Bolt-on panels are quick;
# welded structure, glass bonding and the passenger cell are slow. Labour does not scale with
# car value, only with the class labour rate. Detached parts use their region's hours.
[region_labour_hours]
FrontBumper = 1.5
Hood = 1.5
FrontLeftFender = 2.0
FrontRightFender = 2.0
LeftDoorF = 3.0
LeftDoorR = 3.0
RightDoorF = 3.0
RightDoorR = 3.0
Roof = 8.0
RearLeftQuarter = 6.0
RearRightQuarter = 6.0
Trunk = 1.5
RearBumper = 1.5
Windshield = 2.0
RearGlass = 1.5
FrameFront = 10.0
FrameRear = 8.0
FrameLeft = 7.0
FrameRight = 7.0
Cabin = 14.0

[component_labour_hours]
