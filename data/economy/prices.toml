# Labour multiplier by district (prompt 05 district ids; unknown ids use "default").
[district_labour]
default = 1.0
Core = 1.25
Suburb = 1.0
Industrial = 0.85
Docks = 0.8
Hills = 1.1

[shop]
crooked_markup = 1.15          # crooked shop, car not wanted
crooked_wanted_markup = 1.6    # crooked shop, wanted car: no questions asked, pay for it
legit_reports_at = "L2"        # legit shops call it in at wanted level 2+

# Salvage = base × (min_frac + health_frac × health) + mods_frac × installed mods price.
[scrap]
min_frac = 0.08
health_frac = 0.32
mods_frac = 0.3

# Insurance: premium per day as a fraction of car value; covers `coverage` of the bill after
# the deductible. Voided when captured while wanted; damage sustained while wanted is not paid.
[insurance.basic]
premium_per_day_frac = 0.0025
coverage = 0.5
deductible = 500

[insurance.full]
premium_per_day_frac = 0.005
coverage = 0.8
deductible = 250
