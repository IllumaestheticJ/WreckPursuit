# Repair, towing, scrap and insurance prices. Owned by workstream 08 (economy).
# Consumed by wp_economy::Economy::price_table (-> wp_contracts::PriceTable for wp_damage) and
# by repair billing. All money in whole in-game currency units.
#
# Parts cost of a region / component = reference cost below × class.parts_scale × value factor,
# value factor = clamp(car value / class.reference_value, value_factor_clamp).
# Parts on a line: full price at severity >= 0.6 (replace), else repair_parts_fraction ×
# severity / 0.6 of it (straighten / repair) — the same rule wp_damage uses.
# Labour = item hours (tables below, else labour_hours_per_item) × max(severity, 0.1)
#          × class.labour_per_hour × district × shop markup.
# The bill is then × the damage mode's repair_cost_scale (data/modes: Sim 1.0, Arcade 0.5).
#
# Feel target: a fully wrecked car (every line at severity 1) costs ~2× its value in
# Simulation (>= 60% is the hard floor, checked by tests); a bumper scrape costs less than a
# buy-in; a medium front-end hit costs about one race win in Simulation (half in Arcade).

labour_hours_per_item = 2.0        # fallback for items not in the hour tables below
value_factor_clamp = [0.4, 2.5]
repair_parts_fraction = 0.3        # a repair (not a replacement) costs 30% of the part at most

