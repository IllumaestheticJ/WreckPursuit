# Race purses, buy-ins, rep, bounties, pink slips, informants. Owned by workstream 08.
#
# winner purse = max(min_purse, base_per_km × min(km, max_km)) × class_purse × day_phase.purse
#                × mode_purse × wanted_purse
# position n gets placement_share[n-1] of it; clean race (no contact, no violations beyond
# speeding) adds clean_bonus on top. Buy-in = entry_frac × base purse × day_phase.entry.
#
# Feel target (Compact, 9 km night sprint, Arcade): win ~2 800, buy-in ~300; a mid-skill racer
# nets ~3 000 a night before repairs.

placement_share = [1.0, 0.5, 0.25, 0.1]
placement_rep = [120, 70, 40, 15]
dnf_rep = -20
clean_bonus = 0.25
clean_rep = 25

[race_types.Sprint]
base_per_km = 230
min_purse = 600
entry_frac = 0.12
max_km = 20

[race_types.Circuit]
base_per_km = 220
min_purse = 600
entry_frac = 0.12
max_km = 25

[race_types.Drag]
base_per_km = 2500       # a 402 m pass pays ~1 000
min_purse = 500
entry_frac = 0.15
max_km = 1

[race_types.Touge]
base_per_km = 280
min_purse = 800
entry_frac = 0.15
max_km = 15

[race_types.Meet]          # informal meet: free entry, small purse; allowed while in debt
base_per_km = 110
min_purse = 250
entry_frac = 0.0
max_km = 10

# Contract race kinds (wp_race events; agreed with workstream 15, race.md R5). Each kind is
# priced by one race_types row × purse; buy-in × entry. Multipliers keep wp_race's relative
# advertised purses (data/events/stakes.toml [kinds]) at a 9 km night Compact race:
# checkpoint 0.8, cannonball 1.2, delivery 1.0, outrun ~0.75, time attack ~0.55, drag ~0.4 of a
# sprint (tests/race_kinds.rs keeps them within 15 %).
[race_kinds.sprint]
race_type = "Sprint"
purse = 1.0
entry = 1.0

[race_kinds.circuit]
race_type = "Circuit"
purse = 1.0
entry = 1.0

[race_kinds.drag]          # a 402 m pass: ~0.42 of a 9 km sprint, as in wp_race
race_type = "Drag"
purse = 0.85
entry = 1.0

[race_kinds.outrun]        # 1v1 gap duel in open traffic: the touge row (high buy-in), smaller pot
race_type = "Touge"
purse = 0.65
entry = 1.0

[race_kinds.checkpoint]    # any path between gates: shorter effective route
race_type = "Sprint"
purse = 0.8
entry = 0.9

[race_kinds.cannonball]    # cross-city through heavy traffic: most risk
race_type = "Sprint"
purse = 1.2
entry = 1.0

[race_kinds.delivery]      # cargo damage is charged separately (wp_race cargo_damage_cost)
race_type = "Sprint"
purse = 1.0
entry = 0.7

[race_kinds.time_attack]   # solo clock: no contact with rivals, least risk
race_type = "Circuit"
purse = 0.6
entry = 0.7

# Legality (wp_contracts::Legality). Sanctioned events pay less and cost more to enter (no
# police); a rare illegal daytime race pays ~2.5x a night street race once the day-phase purse
# (0.75 vs 1.35) is applied.
[legality.sanctioned]
purse = 0.8
entry = 1.2

[legality.street]
purse = 1.0
entry = 1.0

[legality.illegal_daytime]
purse = 4.5
entry = 1.5

[day_phase.Day]
purse = 0.75
entry = 0.8
rep = 0.8
bounty = 0.8

[day_phase.Dusk]
purse = 1.0
entry = 1.0
rep = 1.0
bounty = 1.0

[day_phase.Night]
purse = 1.35
entry = 1.2
rep = 1.4
bounty = 1.3

[day_phase.Dawn]
purse = 1.1
entry = 1.0
rep = 1.1
bounty = 1.1

[class_purse]
Beater = 0.5
Compact = 1.0
Sport = 1.7
Muscle = 1.6
Exotic = 4.0
Truck = 1.1
PoliceCruiser = 1.0      # police classes do not race; present for completeness
PoliceInterceptor = 1.0
