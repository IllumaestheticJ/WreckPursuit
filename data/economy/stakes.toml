# Race purses, buy-ins, rep, bounties, pink slips, informants. Owned by workstream 08.
#
# winner purse = max(min_purse, base_per_km × min(km, max_km)) × class_purse × day_phase.purse
#                × mode_purse × wanted_purse
# position n gets placement_share[n-1] of it; clean race (no contact, no violations beyond
# speeding) adds clean_bonus on top. Buy-in = entry_frac × base purse × day_phase.entry.
#
# Feel target (Compact, 9 km night sprint, Arcade): win ~2 800, buy-in ~300; a mid-skill racer
# nets ~3 000 a night before repairs.

placement_share = [1.0, 0.5, 0.25, 0.1]
placement_rep = [120, 70, 40, 15]
dnf_rep = -20
clean_bonus = 0.25
clean_rep = 25

[race_types.Sprint]
base_per_km = 230
min_purse = 600
entry_frac = 0.12
max_km = 20

[race_types.Circuit]
base_per_km = 220
min_purse = 600
entry_frac = 0.12
max_km = 25

[race_types.Drag]
