[workspace]
resolver = "2"
members = [
    "crates/wp_contracts",
    "crates/wp_math",
    "crates/wp_vehicle",
    "crates/wp_damage",
    "crates/wp_world",
    "crates/wp_police",
    "crates/wp_weather",
    "crates/wp_economy",
    "crates/wp_net",
    "crates/wp_opponent",
    "crates/wp_sim",
    "crates/wp_audio",
    "crates/wp_race",
    "crates/wp_wasm",
    "apps/server",
    "apps/simcli",
    "apps/meta",
    "tools/meta-cli",
    "tools/wasm-determinism",
    "tools/lint-determinism",
    "tools/bench",
    "apps/testbed-native",
    "tools/city-import",
    "tools/tuning-dash/probe",
    "tools/specsheet/ram_probe",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# Internal crates
wp_contracts = { path = "crates/wp_contracts" }
wp_math = { path = "crates/wp_math" }
wp_vehicle = { path = "crates/wp_vehicle" }
wp_damage = { path = "crates/wp_damage" }
wp_world = { path = "crates/wp_world" }
wp_police = { path = "crates/wp_police" }
wp_weather = { path = "crates/wp_weather" }
wp_economy = { path = "crates/wp_economy" }
wp_net = { path = "crates/wp_net" }
wp_sim = { path = "crates/wp_sim" }
wp_opponent = { path = "crates/wp_opponent" }
wp_audio = { path = "crates/wp_audio" }
wp_race = { path = "crates/wp_race" }

# External crates
rapier3d = { version = "0.36", features = ["enhanced-determinism", "serde-serialize"] }
# rapier 0.36 math is glam-based (rapier3d::math); nalgebra is available for crates that need
# general linear algebra. Keep the version matched to the one rapier pulls in.
nalgebra = { version = "0.35", features = ["serde-serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
schemars = "1"
ron = "0.12"
thiserror = "2"
indexmap = { version = "2", features = ["serde"] }
wasm-bindgen = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
jsonschema = { version = "0.59", default-features = false }

[profile.release]
debug = 1

# Test speed (lead helper, see docs/integration/harness.md "Lead helper: test speed").
# `cargo test` simulates minutes of city, traffic, police and Rapier physics; unoptimised
# that took over an hour. Optimise every dependency and the simulation crates in the dev/test
# profile. Debug assertions and overflow checks stay on (opt-level does not change them), and
# no hash changes: rustc never reorders or fuses (FMA) float operations at any opt-level, and
# the goldens + native-vs-wasm compare check that. Everything else in the workspace keeps
# opt-level 0 so edit-compile cycles stay quick.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.wp_math]
opt-level = 2

[profile.dev.package.wp_vehicle]
opt-level = 2

[profile.dev.package.wp_damage]
opt-level = 2

[profile.dev.package.wp_world]
opt-level = 2

[profile.dev.package.wp_police]
opt-level = 2

[profile.dev.package.wp_weather]
opt-level = 2

[profile.dev.package.wp_opponent]
opt-level = 2

[profile.dev.package.wp_race]
opt-level = 2

[profile.dev.package.wp_sim]
opt-level = 2

[profile.dev.package.simcli]
opt-level = 2
